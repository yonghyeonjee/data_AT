  function displayYmd(v){ var s = String(v || ''); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s.replace(/-/g, '.') : s; }
  function parseQuoteDate(v){ var m = String(v || '').match(/^(\d{4})[.\-](\d{1,2})[.\-](\d{1,2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(); }
  function calcUntilDate(mode, base){
    if(mode === 'none') return '';
    var d = parseQuoteDate(base);
    if(mode === 'eom'){ d = new Date(d.getFullYear(), d.getMonth()+1, 0); return isoYmd(d); }
    var days = parseInt(mode, 10);
    if(!isNaN(days)){ d.setDate(d.getDate() + days); return isoYmd(d); }

  }
  function normalizeUntilState(q){
    if(!q || !q.cust) return;

  function setPath(o, p, v){ var ks = p.split('.'), t = o; for(var i = 0; i < ks.length - 1; i++){ if(t[ks[i]] == null) t[ks[i]] = {}; t = t[ks[i]]; } t[ks[ks.length - 1]] = v; }
  function careInfo(care){
    if(!care || care === '-') return { type: '-', cycle: '-' };
    if(care === '무상수리') return { type: '무상수리', cycle: '-' };
    var m = care.match(/\((\d+)개월/);
    var cyc = m ? (m[1] + '개월') : (care.indexOf('방문') >= 0 ? '12개월' : '-');

  function qDialog(msg, opts){

    return new Promise(function(res){
      var d = document.createElement('div');
      d.className = 'q-dlg-ov no-print';
      d.innerHTML = '<div class="q-dlg" role="dialog" aria-modal="true">'
        + '<div class="q-dlg-msg">' + String(msg).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\n/g, '<br>') + '</div>'

        + (opts.cancel === false ? '' : '<button type="button" class="q-dlg-b" data-v="0">' + (opts.cancelText || '취소') + '</button>')
        + '<button type="button" class="q-dlg-b pri" data-v="1">' + (opts.okText || '확인') + '</button>'
        + '</div></div>';
      function fin(v){ if(d.parentNode) d.remove(); document.removeEventListener('keydown', onKey, true); res(v); }
      function onKey(e){
        if(e.key === 'Escape'){ e.stopPropagation(); fin(false); }
        else if(e.key === 'Enter'){ e.stopPropagation(); fin(true); }
      }
      d.addEventListener('click', function(e){
        var b = e.target.closest('.q-dlg-b');
        if(b){ fin(b.getAttribute('data-v') === '1'); return; }
        if(e.target === d && opts.cancel !== false) fin(false);
      });
      document.addEventListener('keydown', onKey, true);
      document.body.appendChild(d);
      var pb = d.querySelector('.q-dlg-b.pri'); if(pb) pb.focus();
    });
  }

  function normalizeQuote(q){
    if(!q) return;
    normalizeUntilState(q);

    if(!q.meta) q.meta = { no: '', version: 0, issuedAt: '' };
    if(!q.opt) q.opt = {};

    if(q.cust && q.cust.revisit == null) q.cust.revisit = '';
    if(!q.opt.qrType) q.opt.qrType = (q.opt.showQR === false) ? 'none' : 'tel';
    if(q.opt.qrType === 'mobile') q.opt.qrType = 'vcard';   // v2 초기(MECARD) 값 호환
    q.opt.showQR = q.opt.qrType !== 'none';
    if(!q.opt.show) q.opt.show = defaultShow();
    if(q.opt.lumpSum == null) q.opt.lumpSum = 0;
    if(typeof q.opt.rewardOn !== 'boolean') q.opt.rewardOn = false;
    (q.items || []).forEach(function(it){
      if(!it.disc) it.disc = {};
      if(!it.auto) it.auto = { total: false, card: false };   // v1 데이터는 직접입력 값으로 보존
      if(typeof it.auto.total !== 'boolean') it.auto.total = false;
      if(typeof it.auto.card !== 'boolean') it.auto.card = false;
      if(typeof it.cardMonthly !== 'number'){
        var m = num(it.months);
        it.cardMonthly = m > 0 ? Math.round(num(it.disc.card) / m) : 0;
      }
      if(typeof it.multiOk !== 'boolean') it.multiOk = num(it.disc.multi) > 0;
      if(typeof it.cardName !== 'string') it.cardName = '';
      if(typeof it.cardTier !== 'string') it.cardTier = '';
    });
  }

  /* ═══════════ 2) 견적 계산 — 엑셀 견적서 수식 그대로 ═══════════
     E9  금액        = 단가(월구독료) × 기간
     E10 카드할인    = 단가(월청구할인) × 기간
     E16 구독 혜택가 = E9 − E10 − E11(포인트) − … − E15(상품권)
     G9  체감 구독료 = C9 − C10
     E24~E32 합계    = 각 상품 SUM
     ═══════════════════════════════════════════════════════════ */
  function calcItem(it, pm){
    if(!it.auto) it.auto = { total: true, card: true };
    if(!it.disc) it.disc = {};
    var m = Math.max(0, Math.round(num(it.months)));
    var monthly = num(it.monthly);
    // ① 총 구독료 = 월 구독료 × 기간
    var total = (it.auto.total !== false) ? monthly * m : num(it.total);
    it.total = total;
    // ② 제휴카드 청구할인 = 월 청구할인 × 기간
    var cardMonthly = num(it.cardMonthly);
    var card;
    if(it.auto.card !== false){ card = cardMonthly * m; }
    else { card = num(it.disc.card); cardMonthly = m > 0 ? Math.round(card / m) : 0; it.cardMonthly = cardMonthly; }
    it.disc.card = card;
    var d = it.disc;
    var sub = num(d.sub), multiRaw = num(d.multi), pre = num(d.prepay), point = num(d.point);
    // ③ 다품목 미해당 상품은 다품목 할인 제외 (원본 값은 보존)
    var multi = (it.multiOk === false) ? 0 : multiRaw;
    var cons = num(it.consumable), gift = num(it.giftcard), preAmt = num(it.prepayAmt);
    // ④ 총 혜택 · 최종 혜택가 — 포인트는 표기 방식과 무관하게 항상 차감,
    //    선납금은 DPS 월 구독료에 선납 할인이 이미 반영되어 있으므로 총 지불액에 "가산"
    var benefit = sub + multi + pre + card + point + cons + gift;
    var preAdd = it.preIncl ? 0 : preAmt;   // /quote/ 는 총 구독료에 선납금이 이미 들어 있다 (DPS 총구독료)
    var finalP = Math.max(0, total - benefit) + preAdd;
    // ⑤ 월 단위 지표
    var payM = m > 0 ? Math.round((total - sub - multi - pre - (it.preIncl ? preAmt : 0)) / m) : 0;                 // 할인 후 월 청구액(카드 전)
    var afterCardM = Math.max(0, payM - cardMonthly);                                    // 체감 구독료 = 월구독료 − 월카드할인
    var remainM = m > 0 ? Math.max(0, Math.round((total - sub - multi - pre - card - preAmt) / m)) : 0;
    var realM = m > 0 ? Math.max(0, Math.round((finalP - preAmt) / m)) : 0;
    var freeMonths = (point > 0 && remainM > 0) ? Math.floor(point / remainM) : 0;
    return { m: m, monthly: monthly, total: total, sub: sub, multi: multi, multiRaw: multiRaw, pre: pre, point: point,
             card: card, cardMonthly: cardMonthly, cons: cons, gift: gift, preAmt: preAmt, preAdd: preAdd,
             benefit: benefit, finalP: finalP, payM: payM, afterCardM: afterCardM,
             remainM: remainM, realM: realM, freeMonths: freeMonths };
  }
  function calcTotals(q){
    var pm = q.opt.pointMode, T = { total: 0, sub: 0, multi: 0, pre: 0, point: 0, card: 0, cardM: 0, cons: 0, gift: 0, extra: 0, benefit: 0, finalP: 0,
      monthly: 0, afterCardM: 0, realM: 0, remainM: 0, preAmt: 0, maxM: 0, count: 0, multiCount: 0 };
    q.items.forEach(function(it){
      if(it.hidden) return;
      var c = calcItem(it, pm);
      T.count++; T.total += c.total; T.sub += c.sub; T.multi += c.multi; T.pre += c.pre; T.point += c.point;
      T.card += c.card; T.cardM += c.cardMonthly; T.cons += c.cons; T.gift += c.gift; T.preAmt += c.preAmt; T.preAdd = (T.preAdd || 0) + c.preAdd; T.finalP += c.finalP;
      T.monthly += c.monthly; T.afterCardM += c.afterCardM; T.realM += c.realM; T.remainM += c.remainM;
      if(it.multiOk) T.multiCount++;
      if(c.m > T.maxM) T.maxM = c.m;
    });
    (q.extra || []).forEach(function(e){ T.extra += num(e.amount); });
    T.finalP = Math.max(0, T.finalP - T.extra);
    /* 💵 이벤트 리워드 1% — 최종가에 실제 차감 반영 (기준: 리워드 반영 전 혜택가 · 천원 올림) */
    T.reward = 0;
    if(q.opt.rewardOn){
      T.reward = Math.ceil(Math.max(0, T.finalP) * 0.01 / 1000) * 1000;
      T.finalP = Math.max(0, T.finalP - T.reward);
    }
    /* 공통 멤버십 포인트 (DPS 전체 합산 입력) — 합계에서만 차감, 상품별 칸과 병행 */
    T.pointItems = T.point;
    T.pointCommon = num(q.opt.pointCommon);
    if(T.pointCommon > 0){ T.point += T.pointCommon; T.finalP = Math.max(0, T.finalP - T.pointCommon); }
    T.benefit = T.sub + T.multi + T.pre + T.card + T.point + T.cons + T.gift + T.extra + T.reward;
    T.pct = T.total > 0 ? (T.benefit / T.total * 100) : 0;
    return T;
  }
  /* ★ 기간별 월 납입 — 상품마다 계약 기간이 다르면 기간 구간별로 매달 나가는 금액이 달라진다.
     예) 36개월 + 60개월 + 72개월 → [1~36] 세 상품 합 / [37~60] 두 상품 합 / [61~72] 한 상품
     금액 기준은 상품 카드의 "월 구독료 혜택가(통장 출금)" = 할인 후 월 결제액 − 카드 청구할인 */
  function periodSegments(q){
    var pm = q.opt.pointMode, arr = [];
    q.items.forEach(function(it){
      if(it.hidden) return;
      var c = calcItem(it, pm);
      if(c.m > 0) arr.push({ m: c.m, monthly: c.monthly, card: c.cardMonthly, net: c.afterCardM, label: String(it.model || it.tab || '상품').trim() || '상품' });
    });
    var bounds = [];
    arr.forEach(function(a){ if(bounds.indexOf(a.m) < 0) bounds.push(a.m); });
    bounds.sort(function(a, b){ return a - b; });
    var segs = [], prev = 0;
    bounds.forEach(function(b){
      var s = { from: prev + 1, to: b, len: b - prev, monthly: 0, card: 0, net: 0, labels: [], ends: [] };
      arr.forEach(function(a){
        if(a.m > prev){ s.monthly += a.monthly; s.card += a.card; s.net += a.net; s.labels.push(a.label); }
        if(a.m === b) s.ends.push(a.label);
      });
      segs.push(s);
      prev = b;
    });
    return { items: arr, segs: segs, mixed: bounds.length > 1 };
  }

  /* ★ QR 생성 — 홈페이지 / 전화걸기(tel:) / 연락처 저장(vCard) / 이메일(mailto:)
     ※ MECARD는 쓰지 않습니다 — 일본 피처폰 규격이라 한글이 깨지는 리더가 있고,
        URL의 콜론(:)처럼 예약문자를 escape하지 않으면 필드가 깨져 읽힙니다.
        연락처 저장은 UTF-8을 정식 지원하는 vCard 3.0으로 생성합니다. */
  function vcardEsc(s){ return String(s == null ? '' : s).replace(/([\\;,])/g, '\\$1').replace(/\r?\n/g, '\\n'); }
  function telDigits(s){ return String(s || '').replace(/[^0-9+]/g, ''); }
  function qrData(q, nc){
    var t = q.opt.qrType || 'tel';
    if(t === 'none') return null;
    var home = QUOTE_CFG.store.home;
    if(t === 'tel'){
      var tel = telDigits(nc && nc.mobile);
      if(!tel) return { data: home, cap: '홈페이지', guide: 'QR 스캔 시 홈페이지로 연결됩니다' };
      return { data: 'tel:' + tel, cap: '전화 걸기', guide: 'QR 스캔 시 상담사에게 전화가 연결됩니다' };
    }
    if(t === 'email'){
      var em = (nc && nc.email) ? String(nc.email).trim() : '';
      if(!em) return { data: home, cap: '홈페이지', guide: 'QR 스캔 시 홈페이지로 연결됩니다' };
      return { data: 'mailto:' + em, cap: '이메일 쓰기', guide: 'QR 스캔 시 상담사에게 메일 쓰기로 연결됩니다' };
    }
    if(t === 'vcard'){
      if(!nc || (!nc.mobile && !nc.tel)) return { data: home, cap: '홈페이지', guide: 'QR 스캔 시 홈페이지로 연결됩니다' };
      var L = ['BEGIN:VCARD', 'VERSION:3.0'];
      L.push('N:' + vcardEsc(nc.name) + ';;;;');
      L.push('FN:' + vcardEsc(nc.name));
      L.push('ORG:' + vcardEsc(QUOTE_CFG.store.name));
      if(nc.position || nc.dept) L.push('TITLE:' + vcardEsc([nc.position, nc.dept].filter(Boolean).join(' ')));
      if(nc.mobile) L.push('TEL;TYPE=CELL:' + telDigits(nc.mobile));
      if(nc.tel) L.push('TEL;TYPE=WORK:' + telDigits(nc.tel));
      if(nc.email) L.push('EMAIL;TYPE=INTERNET:' + vcardEsc(nc.email));
      L.push('URL:' + home);                       // vCard는 URL 콜론을 escape하지 않음 (정상)
      L.push('END:VCARD');
      return { data: L.join('\r\n'), cap: '연락처 저장', guide: 'QR 스캔 시 상담사 연락처를 저장할 수 있습니다' };
    }
    return { data: home, cap: '홈페이지', guide: 'QR 스캔 시 삼성스토어 시흥 홈페이지로 연결됩니다' };
  }

  function qrImgSrc(data){

  /* ★ 매달 내시는 금액 — 고객이 한눈에 보는 요약 밴드

       E18 월 구독료 합계      = Σ 월 구독료
       E19 카드 할인 합계금액  = Σ 월 청구할인
       E20 월 구독료 혜택가    = E18 − E19        (통장에서 실제로 나가는 금액)
       E21 월 체감 구독료      = 구독 혜택가 합계 ÷ 계약개월  (포인트까지 반영)
     선납금이 있으면 "선납 후 월 납입" 칸이 하나 더 붙습니다.
     상품별 계약 기간이 다르면 "첫 구간(모든 상품 납부 중)" 기준으로 표기하고,
     기간별 금액은 아래 [기간별 월 납입 안내]에 나눠 보여줍니다. */
  function payBandHtml(q, T){
    var P = periodSegments(q);
    if(!P.segs.length) return '';
    var m = T.maxM;
    var first = P.segs[0];
    var monthly = Math.round(first.monthly);                  // ① 월 구독료 합계 (첫 구간)
    var cardM   = Math.round(first.card);                     // ② 카드 청구할인 합계
    var netM    = Math.round(first.net);                      // ③ 월 구독료 혜택가 (상품 카드 출금액의 합)
    var discM   = Math.max(0, monthly - cardM - netM);        // 선할인(구독료·다품목·선납) 월 환산
    var realM   = Math.max(0, Math.round(T.realM - (num(q.opt.pointCommon) || 0) / m)); // ④ 월 체감 구독료 (공통 포인트까지 반영 · 선납금 제외)
    var hasPre  = T.preAmt > 0;
    var afterPreM = Math.round(T.remainM);                     // 선납 후 남은 월 납입 (상품별 합)
    var pointOn = (q.opt.pointMode === 'replace') && T.point > 0;
    function c(k, v, cls, sub){
      return '<div class="c' + (cls === 'big' ? ' big' : '') + '"><div class="k">' + k + '</div>'
        + '<div class="v' + (cls === 'minus' ? ' minus' : '') + '">' + v + '</div>'
        + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
    }
    var S = (q.opt.show || {});
    var cells = '', n = 0;
    cells += c('월 구독료 합계', won(monthly)); n++;
    if(discM > 0){ cells += c('구독료 할인 (월 환산)', '-' + won(discM), 'minus'); n++; }
    if(cardM > 0){ cells += c('제휴카드 청구할인', '-' + won(cardM), 'minus'); n++; }
    if(hasPre && S.prepayLine){ cells += c('선납 후 월 납입', won(afterPreM)); n++; }
    if(S.realM){ cells += c('월 체감 구독료' + (pointOn ? ' (⭐반영)' : ''), won(realM)); n++; }
    cells += c('월 구독료 혜택가' + (P.mixed ? ' (1~' + first.to + '개월)' : ''), won(netM), 'big',
      P.mixed ? '이후 기간별 금액은 아래 안내 참고' : m + '개월 · 통장에서 나가는 금액'); n++;
    var note = '※ 월 구독료 혜택가는 ' + (discM > 0 ? '구독료 할인과 ' : '') + '제휴카드 청구할인까지 반영해 실제로 통장에서 빠져나가는 금액입니다.'
      + (P.mixed ? ' 상품별 계약 기간이 달라 ' + first.to + '개월 이후에는 월 납입액이 줄어듭니다.' : '')
      + (S.realM ? ' 월 체감 구독료는 ' + (pointOn ? '멤버십 포인트까지 ' : '') + '모든 혜택을 계약 개월로 나눈 실질 부담액입니다.' : '')
      + (hasPre ? ' 선납금 ' + won(T.preAmt) + '은 계약 시 미리 결제하시는 금액입니다.' : '');
    var right = P.mixed
      ? '계약 ' + P.segs.map(function(s){ return s.to; }).join(' / ') + '개월 혼합'
      : m + '개월';
    return '<div class="q-pay"><div class="q-pay-h">💳 고객님이 매달 내시는 금액'
      + '<span class="r">' + right + (T.count > 1 ? ' · 상품 ' + T.count + '개 합계' : '') + '</span></div>'
      + '<div class="q-pay-grid" style="grid-template-columns:repeat(' + (n - 1) + ',1fr) 1.3fr">' + cells + '</div>'
      + '<div class="q-pay-note">' + note + '</div></div>';
  }
  /* ★ 기간별 월 납입 안내 — 상품별 계약 기간이 다를 때만 표시
     "36개월까지는 매달 n원, 37~60개월은 매달 m원, 61~72개월은 매달 p원" */

  function paginate(container, blocks, footHtml, q, pageCls){
    var pages = [];
    function newPage(){
      var p = document.createElement('div');
      p.className = 'q-page' + pageCls;
      p.innerHTML = '<div class="q-pg-body">' + (pages.length ? contHeaderHtml(q) : '') + '</div><div class="q-pg-end"></div>' + runFootHtml(q);
      container.appendChild(p); pages.push(p); return p;
    }
    function over(p){ return p.scrollHeight > p.clientHeight + 1; }
    function minKids(){ return pages.length > 1 ? 1 : 0; }
    var p = newPage(), body = p.firstChild;
    blocks.forEach(function(html){
      if(!html) return;
      var tmp = document.createElement('div'); tmp.innerHTML = html;
      var el = tmp.firstChild; if(!el) return;
      body.appendChild(el);
      if(over(p) && body.children.length > minKids() + 1){
        body.removeChild(el);
        p = newPage(); body = p.firstChild; body.appendChild(el);
      }
    });
    var end = p.querySelector('.q-pg-end');
    end.innerHTML = footHtml;
    if(pages.length === 1){ var run1 = p.querySelector('.q-pg-run'); if(run1) run1.remove(); }   // 1장 후보: 러닝 푸터 없이 판정 (하단 매장 정보와 중복)

      if(pages.length === 1 && !p.querySelector('.q-pg-run')) p.insertAdjacentHTML('beforeend', runFootHtml(q));
      end.innerHTML = '';

      while(body.lastChild && body.children.length > minKids() + 1 && /q-note|q-memo/.test(body.lastChild.className || '')){
        carry.unshift(body.lastChild); body.removeChild(body.lastChild);
      }
      p = newPage(); body = p.firstChild;
      carry.forEach(function(c){ body.appendChild(c); });
      p.querySelector('.q-pg-end').innerHTML = footHtml;
    }
    if(pages.length > 1){
      if(!pages[0].querySelector('.q-pg-run')) pages[0].insertAdjacentHTML('beforeend', runFootHtml(q));
      pages.forEach(function(pg, i){ pg.querySelector('.pn').textContent = (i + 1) + ' / ' + pages.length; });

    var pageW = (c.querySelector('.q-page') || {}).offsetWidth || 794;

    if(USER_ZOOM > 0){ k = USER_ZOOM; }
    else {
      var cap = avail < 900 ? 1 : 1.15;                 /* 모바일에선 확대 없이 화면 맞춤만 */
      k = Math.min(cap, avail / w);                     /* 전체(가로 나란히)가 들어가게 */

  /* ── 발행 내역 검색 색인 ──

  function histIndex(x){

      var i = ix.phone.lastIndexOf(ix.last4);
      if(i >= 0) return esc(ix.phone.slice(0, i)) + '<span class="q-hi-l4">' + esc(ix.last4) + '</span>' + esc(ix.phone.slice(i + 4));

    box.innerHTML = list.map(function(x){

      var hit = l4 && histIx(x).last4 === l4;
      return '<div class="q-hist-item' + (hit ? ' hit' : '') + '" data-qload="' + key + '">'

  var HIST = [], HIST_WHERE = '';
  function filterHistory(keyword){
    var raw = String(keyword || '').trim();
    if(!raw){ renderHistory(HIST, HIST_WHERE || '발행 내역'); return; }
    var toks = raw.toLowerCase().split(/\s+/).filter(Boolean);
    var filtered = HIST.filter(function(x){
      var ix = histIx(x);
      return toks.every(function(t){
        if(/^[0-9]+$/.test(t)) return ix.digits.indexOf(t) >= 0 || ix.hay.indexOf(t) >= 0;
        return ix.hay.indexOf(t) >= 0;
      });
    });
    // 4자리 숫자를 넣었으면 "뒷 4자리 정확히 일치"를 위로
    var l4 = toks.filter(function(t){ return /^[0-9]{4}$/.test(t); })[0] || '';
    if(l4){
      filtered.sort(function(a, b){
        return (histIx(a).last4 === l4 ? 0 : 1) - (histIx(b).last4 === l4 ? 0 : 1);
      });
    }
    renderHistory(filtered, (HIST_WHERE || '발행 내역') + ' · 검색', l4);

    var parts = String(key).split('|'), no = parts[0], ver = parseInt(parts[1] || '1', 10);
    var x = HIST.filter(function(h){ return h.no === no && (h.version || 1) === ver; })[0] || HIST.filter(function(h){ return h.no === no; })[0];
    if(!x || !x.quote){ toast('견적 데이터를 불러올 수 없습니다', true); return; }
    qConfirm(no + ' 견적을 불러옵니다.\n현재 작성 중인 내용은 [🕒 임시 저장]에 보관됩니다.', '불러오기').then(function(okl){
      if(!okl) return;
      snapshotDraft('발행 내역 불러오기');
      QUOTE = x.quote; EDIT = true; syncEditBtn();
      normalizeQuote(QUOTE);
      if(!QUOTE.meta) QUOTE.meta = { no: no, version: ver, issuedAt: x.issuedAt || '' };
      renderAll(); toast(no + ' 불러옴 — 다품목 지정·수정 금액까지 복원되었습니다');

  /* ═══════════ 8) 인쇄 · 열기/닫기 ═══════════ */
  function doPrint(){
    document.body.classList.add('quote-print');
    var cleanup = function(){ document.body.classList.remove('quote-print'); window.removeEventListener('afterprint', cleanup); };
    window.addEventListener('afterprint', cleanup);
    setTimeout(function(){ window.print(); setTimeout(cleanup, 1500); }, 120);
  }
  /* 🖨️ 인쇄 = 항상 "발행 후 인쇄"
     · 인쇄물에 견적번호가 찍히고, 같은 내용이 데이터센터(담당자 화면 [견적서])에 남습니다.
     · 이미 발행된 건이면 같은 번호의 다음 버전(v2, v3…)으로 추가 저장됩니다.
     · 고객명·연락처가 비어 발행이 불가능할 때만 "발행 없이 인쇄"를 물어봅니다. */
  function printQuote(){
    var wasEdit = EDIT;
    if(EDIT){ EDIT = false; syncEditBtn(); renderSheet(); }
    var restore = function(){ if(wasEdit && !EDIT){ EDIT = true; syncEditBtn(); renderSheet(); } };
    var go = function(){ doPrint(); setTimeout(restore, 2200); };
    issueQuote({ silent: true }).then(go, function(err){
      if(err && err.code === 'namecard'){ restore(); return; }
      if(err && err.code === 'required'){
        qConfirm('필수 정보(고객명·연락처·모델명·월 구독료)가 부족해 발행할 수 없습니다.\n견적번호 없이 인쇄만 진행할까요?', '인쇄 진행').then(function(okp){
          if(okp) go(); else restore();
        });
        return;
      }
      go();
    });
  }
  /* ── 📤 공유: 화면 그대로 PDF 생성 → 모바일은 공유 시트(카카오톡 등), PC는 다운로드 ── */
  var SHARE_LIBS = null;
  function loadShareLibs(){
    if(window.jspdf && (window.domtoimage || window.html2canvas)) return Promise.resolve();
    if(SHARE_LIBS) return SHARE_LIBS;
    function ld(src){ return new Promise(function(res, rej){
      var el = document.createElement('script'); el.src = src;
      el.onload = res; el.onerror = function(){ rej(new Error('lib')); };
      document.head.appendChild(el);
    }); }
    function ldAny(urls){ return urls.reduce(function(p, u){ return p.catch(function(){ return ld(u); }); }, Promise.reject(new Error('start'))); }
    SHARE_LIBS = Promise.all([
      /* 1순위: dom-to-image-more (실제 브라우저 렌더러 사용 — 한글 품질 최상) */
      ldAny([
        'https://cdn.jsdelivr.net/npm/dom-to-image-more@3.10.2/dist/dom-to-image-more.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js'
      ]).catch(function(){}),
      /* 폴백 캡처 엔진 */
      ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js').catch(function(){}),
      ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    ]).then(function(){
      if(!window.jspdf || !(window.domtoimage || window.html2canvas)){ SHARE_LIBS = null; throw new Error('lib'); }
    }, function(e){ SHARE_LIBS = null; throw e; });
    return SHARE_LIBS;
  }
  /* 캡처 전에 시트 안 이미지를 data:로 인라인 — 다른 도메인 로고(CORS 차단)는 텍스트 로고로 대체 */
  function inlineSheetImages(root){
    var imgs = [].slice.call(root.querySelectorAll('img'));
    return Promise.all(imgs.map(function(im){
      var src = im.getAttribute('src') || '';
      if(!src || src.indexOf('data:') === 0) return Promise.resolve();
      return fetch(src, { mode: 'cors' }).then(function(r){
        if(!r.ok) throw new Error('http');
        return r.blob();
      }).then(function(b){
        return new Promise(function(res){
          var fr = new FileReader();
          fr.onload = function(){ im.setAttribute('src', fr.result); res(); };
          fr.onerror = function(){ res(); };
          fr.readAsDataURL(b);
        });
      }).catch(function(){
        var span = document.createElement('span');
        span.className = im.className;
        span.style.cssText = 'font-family:\'Arial Black\',Arial,sans-serif;font-weight:900;color:#0a3594;font-size:15px;letter-spacing:-.3px;display:inline-block;line-height:1.15;';
        span.textContent = im.getAttribute('alt') || 'SAMSUNG STORE';
        if(im.parentNode) im.parentNode.replaceChild(span, im);
      });
    }));
  }
  function canvasBlank(cv){
    try {
      var ctx = cv.getContext('2d');
      var y = Math.floor(cv.height / 2);
      var d = ctx.getImageData(0, y, cv.width, 1).data;
      for(var i = 0; i < d.length; i += 40){ if(d[i] < 245 || d[i + 1] < 245 || d[i + 2] < 245) return false; }
      var y2 = Math.floor(cv.height / 4);
      d = ctx.getImageData(0, y2, cv.width, 1).data;
      for(var j = 0; j < d.length; j += 40){ if(d[j] < 245 || d[j + 1] < 245 || d[j + 2] < 245) return false; }
      return true;
    } catch(e){ return false; }
  }
  function capturePage(pg){
    var opts = { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false };
    function h2cPlain(){
      if(!window.html2canvas) return Promise.reject(new Error('nolib'));
      var sheet = document.getElementById('qSheet');
      sheet.classList.add('sharecap');
      function off(){ sheet.classList.remove('sharecap'); }
      return window.html2canvas(pg, opts).then(function(cv){ off(); return cv; }, function(e){ off(); throw e; });
    }
    function h2cFo(){
      if(!window.html2canvas) return Promise.reject(new Error('nolib'));
      return window.html2canvas(pg, Object.assign({ foreignObjectRendering: true }, opts))
        .then(function(cv){ return canvasBlank(cv) ? h2cPlain() : cv; }, h2cPlain);
    }
    /* 1순위 dom-to-image(-more): 브라우저 렌더러 그대로 → 화면과 동일한 품질 */
    if(window.domtoimage){
      var k = 2;
      return window.domtoimage.toCanvas(pg, {
        width: pg.offsetWidth * k, height: pg.offsetHeight * k, bgcolor: '#ffffff',
        style: { transform: 'scale(' + k + ')', transformOrigin: 'top left', margin: '0' }
      }).then(function(cv){ return canvasBlank(cv) ? h2cFo() : cv; }, h2cFo);
    }
    return h2cFo();
  }
  function buildSharePdf(){
    var pages = [].slice.call(document.querySelectorAll('#qSheet .q-page'));
    if(!pages.length) return Promise.reject(new Error('nopage'));
    var doc = new window.jspdf.jsPDF({ orientation: 'p', unit: 'mm', format: 'a4', compress: true });
    var chain = Promise.resolve();
    pages.forEach(function(pg, i){
      chain = chain.then(function(){
        return capturePage(pg).then(function(cv){
          if(i > 0) doc.addPage();
          doc.addImage(cv.toDataURL('image/jpeg', 0.93), 'JPEG', 0, 0, 210, 297);
        });
      });
    });
    return chain.then(function(){ return doc.output('blob'); });
  }
  function downloadBlob(blob, nm){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nm;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('📄 PDF가 다운로드되었습니다 — 카카오톡·문자에 첨부해 전송하세요');
  }
  /* ═══════════ 고객에게 보내기 — 링크 한 줄 ═══════════
     PDF 를 브라우저에서 굽는 건 느리고(수십 초) 자주 실패한다.
     고객은 주소 하나로 바로 열고, 필요하면 그 화면에서 인쇄·PDF 저장을 한다. */
  var SEND_UA_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  function sendMsgText(d){
    var money = d.monthly ? ('월 ' + Number(d.monthly).toLocaleString('ko-KR') + '원')
              : (d.final ? Number(d.final).toLocaleString('ko-KR') + '원' : '');
    return '[' + QUOTE_CFG.store.name + '] ' + (d.name || '') + ' 님 견적서입니다.\n'
         + (d.models ? '· ' + d.models + '\n' : '') + (money ? '· ' + money + '\n' : '')
         + d.url + '\n(' + d.expires_d + '일간 열람 가능)';
  }
  function sendCopy(t, msg){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ toast(msg || '링크를 복사했습니다'); },
        function(){ window.prompt('아래를 복사하세요', t); });
    } else { window.prompt('아래를 복사하세요', t); }
  }
  function sendSheet(d){
    var tel = String(d.phone || '').replace(/[^0-9]/g, '');
    var m = document.createElement('div');
    m.className = 'q-sendmask';
    m.innerHTML = '<div class="q-sendbox">'
      + '<div class="q-sendttl">📨 고객에게 보내기 <span>' + esc(d.no) + (d.ver > 1 ? ' · ' + d.ver + '차' : '') + '</span></div>'
      + '<div class="q-sendsub"><b>' + esc(d.name || '') + '</b> 님' + (d.models ? ' · ' + esc(d.models) : '')
      +   (d.monthly ? ' · 월 ' + Number(d.monthly).toLocaleString('ko-KR') + '원'
                     : (d.final ? ' · ' + Number(d.final).toLocaleString('ko-KR') + '원' : '')) + '</div>'
      + '<div class="q-sendurl">' + esc(d.url) + '</div>'
      + '<div class="q-sendbtns">'
      +   '<button type="button" data-a="copy">🔗 링크 복사</button>'
      +   '<button type="button" data-a="sms">💬 문자로 보내기</button>'
      +   '<button type="button" data-a="share">↗ 카카오 · 공유</button>'
      +   '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">👁 고객 화면 미리보기</a>'
      + '</div>'
      + '<div class="q-sendnote"><b>' + d.expires_d + '일</b> 뒤(' + esc(d.expires_at) + ')까지 열립니다'
      +   (d.views ? ' · 지금까지 <b>' + d.views + '번</b> 열림' : '')
      +   '<br>링크를 받은 사람만 볼 수 있습니다. 고객 화면에서 인쇄·PDF 저장이 됩니다.</div>'
      + '<button type="button" class="q-sendclose" data-a="close">닫기</button>'
      + '</div>';
    m.addEventListener('click', function(e){
      if(e.target === m){ m.remove(); return; }
      var b = e.target.closest('[data-a]'); if(!b) return;
      var a = b.getAttribute('data-a');
      if(a === 'close'){ m.remove(); return; }
      if(a === 'copy'){ sendCopy(d.url); return; }
      if(a === 'sms'){
        if(!SEND_UA_MOBILE){ toast('문자 자동 발송은 아직 연동 전입니다 — 링크를 복사해 보내주세요', true); sendCopy(d.url); return; }
        var body = encodeURIComponent(sendMsgText(d));
        location.href = (/iPhone|iPad/i.test(navigator.userAgent) ? 'sms:' + tel + '&body=' + body : 'sms:' + tel + '?body=' + body);
        return;
      }
      if(a === 'share'){
        var txt = sendMsgText(d);
        if(navigator.share){
          navigator.share({ title: (d.name || '') + ' 님 견적서', text: txt, url: d.url })
            .catch(function(err){ if(err && err.name !== 'AbortError') sendCopy(txt, '문자 내용을 복사했습니다 — 카카오톡에 붙여 넣으세요'); });
        } else { sendCopy(txt, '문자 내용을 복사했습니다 — 카카오톡에 붙여 넣으세요'); }
      }
    });
    document.body.appendChild(m);
  }
  function sendQuoteLink(){
    var btn = document.getElementById('qBtnSend');
    var go = function(){
      if(btn){ btn.disabled = true; btn.textContent = '📨 링크 만드는 중…'; }
      dcRpc('fn_quote_page_share', { p_no: QUOTE.meta.no })
        .then(function(r){
          if(!r || !r.ok) throw new Error((r && (r.error || r.reason)) || 'share failed');
          sendSheet(r);
        })
        .catch(function(e){ toast('링크를 만들지 못했습니다 — ' + (e && e.message ? e.message : ''), true); })
        .then(function(){ if(btn){ btn.disabled = false; btn.textContent = '📨 고객에게 보내기'; } });
    };
    if(QUOTE.meta.no){ go(); return; }
    if(btn){ btn.disabled = true; btn.textContent = '📨 발행 중…'; }
    issueQuote({ silent: true }).then(function(){
      if(btn){ btn.disabled = false; btn.textContent = '📨 고객에게 보내기'; }
      if(!QUOTE.meta.no){ toast('먼저 발행이 되어야 보낼 수 있습니다', true); return; }
      go();
    }, function(){
      if(btn){ btn.disabled = false; btn.textContent = '📨 고객에게 보내기'; }
    });
  }

  function shareQuote(){
    var wasEdit = EDIT;
    if(EDIT){ EDIT = false; syncEditBtn(); renderSheet(); }
    var restore = function(){ if(wasEdit && !EDIT){ EDIT = true; syncEditBtn(); renderSheet(); } };
    var btn = document.getElementById('qBtnShare');
    var go = function(){
      if(btn){ btn.disabled = true; btn.textContent = '📤 PDF 생성 중…'; }
      new Promise(function(r){ setTimeout(r, 500); })      /* QR 등 이미지 로드 여유 */
        .then(loadShareLibs)
        .then(function(){ return inlineSheetImages(document.getElementById('qSheet')); })
        .then(function(){
          return Promise.race([
            buildSharePdf(),
            new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, 40000); })
          ]);
        })
        .then(function(blob){
          var nm = '삼성스토어시흥_구독견적서_' + (QUOTE.cust.name || '고객') + (QUOTE.meta.no ? '_' + QUOTE.meta.no : '') + '.pdf';
          var file = null;
          try { file = new File([blob], nm, { type: 'application/pdf' }); } catch(e){}
          /* 공유 시트는 모바일·태블릿에서만 — PC는 Windows 공유(휴대폰과 연결 등) 전송이
             불안정하므로 바로 다운로드해 카톡 PC·문자에 첨부하는 흐름으로 안내 */
          var mobileUA = (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean')
            ? navigator.userAgentData.mobile
            : /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
          if(mobileUA && file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share){
            return navigator.share({ files: [file], title: nm.replace('.pdf', ''), text: QUOTE_CFG.store.name + ' 구독 견적서를 보내드립니다.' })
              .then(function(){ toast('📤 공유 완료'); }, function(){ downloadBlob(blob, nm); });
          }
          downloadBlob(blob, nm);
        })
        .catch(function(){ toast('PDF 생성에 실패했습니다 — [🖨️ 인쇄/PDF]에서 "PDF로 저장"을 이용해 주세요', true); })
        .then(function(){
          if(btn){ btn.disabled = false; btn.textContent = '📤 공유'; }
          restore();
          if(!wasEdit) renderSheet();          /* 캡처용으로 바꾼 이미지 원복 */
        });
    };
    /* 이미 발행된 견적은 재발행 없이 바로 PDF */
    if(QUOTE.meta.no){ go(); return; }
    if(btn){ btn.disabled = true; btn.textContent = '📤 발행 중…'; }
    var issued = false;
    /* 저장이 오래 걸리면 10초 후 견적번호 없이 PDF 진행 */
    var slow = setTimeout(function(){
      if(!issued){ issued = true; toast('저장이 지연되어 먼저 PDF를 만듭니다 — 발행은 뒤에서 계속됩니다'); go(); }
    }, 10000);
    issueQuote({ silent: true }).then(function(){
      clearTimeout(slow);
      if(!issued){ issued = true; go(); }
      else renderSheet();                       /* 늦게 발행 완료 → 번호만 갱신 */
    }, function(err){
      clearTimeout(slow);
      if(issued) return;
      issued = true;
      if(err && err.code === 'namecard'){ if(btn){ btn.disabled = false; btn.textContent = '📤 PDF'; } restore(); return; }
      if(err && err.code === 'required'){
        toast('필수 정보(고객명·연락처·모델명·월 구독료)를 먼저 입력하세요', true);
        if(btn){ btn.disabled = false; btn.textContent = '📤 공유'; }
        restore(); return;
      }
      go();
    });
  }
  /* ═══════════ 9) 페이지 진입 — 계산기 핸드오프 · 수기 신규 · 프리셋 ═══════════ */
  var LS_HANDOFF = 'sh_quote_handoff';

  /* ── 🕒 임시 저장: 작성 중 자동 저장(복원용) + 화면을 비울 때 스냅샷 목록 보관 ── */
  var LS_DRAFT = 'sh_quote_draft', LS_DRAFTS = 'sh_quote_drafts';
  function draftMeaningful(q){
    if(!q || !q.cust) return false;
    return !!(String(q.cust.name || '').trim() || String(q.cust.phone || '').trim()
      || (q.items || []).some(function(it){ return String(it.model || '').trim() || num(it.monthly) > 0; }));
  }
  var _draftTm = null;
  function autosaveDraft(){

      try {
        if(draftMeaningful(QUOTE)) lsSet(LS_DRAFT, { t: Date.now(), quote: QUOTE });

  function draftLabelOf(q){
    var models = (q.items || []).map(function(it){ return it.model; }).filter(Boolean).join(', ');
    return (q.cust.name || '이름 없음') + (models ? ' · ' + models : '') + (q.meta && q.meta.no ? ' · ' + q.meta.no : '');

  function pushDraftSnap(q, why, quiet){
    try {
      if(!draftMeaningful(q)) return;
      var list = lsGet(LS_DRAFTS) || [];
      var snap = { t: Date.now(), why: why || '', label: draftLabelOf(q), quote: JSON.parse(JSON.stringify(q)) };
      list = list.filter(function(d){ return !(d.label === snap.label && snap.t - d.t < 60000); });
      list.unshift(snap);
      if(list.length > 10) list.length = 10;
      lsSet(LS_DRAFTS, list);
      if(!quiet) toast('🕒 작성 중이던 견적을 임시 저장했습니다 — 패널 [🕒 임시 저장]에서 복원');
    } catch(e){}
  }
  function snapshotDraft(why){ pushDraftSnap(QUOTE, why); }
  function restoreDraft(i){
    var list = lsGet(LS_DRAFTS) || [];
    var d = list[i]; if(!d || !d.quote){ toast('임시 견적을 찾을 수 없습니다', true); return; }
    qConfirm('「' + (d.label || '임시 견적') + '」을(를) 불러옵니다.\n현재 작성 중인 내용은 임시 저장 목록에 보관됩니다.', '불러오기').then(function(ok){
      if(!ok) return;
      snapshotDraft('다른 임시 견적으로 전환');
      var list2 = lsGet(LS_DRAFTS) || [];
      QUOTE = d.quote; normalizeQuote(QUOTE); EDIT = true; syncEditBtn(); renderAll();
      toast('🕒 임시 견적을 불러왔습니다');
    });
  }
  function deleteDraft(i){
    qConfirm('이 임시 견적을 삭제할까요?', '삭제').then(function(ok){
      if(!ok) return;
      var list = lsGet(LS_DRAFTS) || [];
      list.splice(i, 1); lsSet(LS_DRAFTS, list); renderPanel();
    });
  }
  function startBlank(){ QUOTE = blankQuote(); EDIT = true; syncEditBtn(); renderAll(); }
  function importHandoff(notify, keep){
    var hd = lsGet(LS_HANDOFF);
    if(!keep){ try { localStorage.removeItem(LS_HANDOFF); } catch(e){} }
    if(!hd || !hd.quote) return false;
    if(Date.now() - (hd.t || 0) > 30 * 60000) return false;
    var q = hd.quote;
    normalizeQuote(q);
    var pr = loadPreset();
    if(pr && pr.show) q.opt.show = pr.show;
    QUOTE = q; EDIT = true; syncEditBtn(); renderAll();
    if(notify) toast('🧮 계산기 결과를 불러왔습니다 — 내용 확인 후 발행하세요');
    return true;
  }
  window.addEventListener('storage', function(ev){
    if(ev.key !== LS_HANDOFF || !ev.newValue) return;
    var busy = QUOTE && (QUOTE.cust.name || QUOTE.items.some(function(it){ return num(it.monthly) > 0; }));
    if(!busy){ importHandoff(true, true); return; }
    qConfirm('계산기에서 새 견적 내용이 도착했습니다. 불러올까요?\n현재 작성 중인 내용은 [🕒 임시 저장]에 보관됩니다.', '불러오기').then(function(okh){
      if(okh){ snapshotDraft('계산기 결과 수신'); importHandoff(true, true); }
    });
  });

  /* ═══════════ 9-b) 🔎 기존 고객 불러오기 ═══════════
     이름 또는 번호 뒷 4자리 → 고객명·연락처·주소·생년월일.
     지난 견적이 있으면 통신사·예식일·입주일까지 이어서 채운다.
     조회는 GAS 를 거친다 — DB 열쇠를 이 페이지에 두지 않기 위해서.                */
  var CUST_ROWS = [], CUST_Q = '', CUST_NOTE = '';
  /* 패널은 renderPanel() 때마다 통째로 다시 그려지므로, 검색어와 결과를 변수에 두고 같이 그린다 */
  function custSearchHtml(){
    return '<details class="q-acc" data-acc="cust" open>'
      + '<summary>🔎 기존 고객 불러오기 <span class="r">이름 · 번호 뒷 4자리</span></summary>'
      + '<div class="q-acc-b">'
      +   '<div class="q-hist-tools">'
      +     '<input type="search" id="qCustQ" placeholder="예) 최인환  또는  6000" enterkeyhint="search" value="' + esc(CUST_Q) + '">'
      +     '<button type="button" class="q-btn" id="qCustBtn" style="background:var(--blue);color:#fff;border-color:var(--blue)">찾기</button>'
      +   '</div>'
      +   '<div id="qCustRows" class="q-hist">' + custRowsHtml() + '</div>'
      +   '<div class="q-hint">고르면 <b>고객명 · 연락처 · 주소 · 생년월일</b>이 채워집니다. '
      +     '지난 견적이 있으면 <b>통신사 · 예식일 · 입주일</b>도 같이 따라옵니다. 새 고객이면 그냥 견적서에 바로 적으세요.</div>'
      + '</div></details>';
  }
  function custRowsHtml(){
    if(!CUST_ROWS.length) return CUST_NOTE ? '<div class="q-hint">' + esc(CUST_NOTE) + '</div>' : '';
    return CUST_ROWS.map(function(x, i){
      var lq = x.last_quote;
      return '<div class="q-hist-item" data-qcust="' + i + '">'
        + '<div class="q-hi-main"><strong>' + esc(x.name || '-') + '</strong> ' + esc(x.phone || '')
        + '<span class="s">' + esc(x.addr || '주소 없음')
        + (Number(x.orders) ? ' · 구매 ' + x.orders + '건' : '')
        + (Number(x.consults) ? ' · 상담 ' + x.consults + '건' : '')
        + (lq ? ' · 지난 견적 ' + esc(lq.no) + (lq.at ? ' (' + esc(lq.at) + ')' : '') : '')
        + '</span></div>'
        + '<button type="button" class="q-btn q-hi-load" data-qcust="' + i + '">불러오기</button></div>';
    }).join('');
  }
  function renderCustRows(rows, note){
    CUST_ROWS = rows || []; CUST_NOTE = CUST_ROWS.length ? '' : (note || '찾는 고객이 없습니다 — 새 고객으로 바로 적으세요');
    var box = document.getElementById('qCustRows'); if(box) box.innerHTML = custRowsHtml();
  }
  function doCustSearch(){
    var el = document.getElementById('qCustQ'); if(!el) return;
    var q = (el.value || '').trim();
    if(q.length < 2){ toast('두 글자 이상 넣어 주세요', true); return; }
    CUST_Q = q;
    var box = document.getElementById('qCustRows');
    if(box) box.innerHTML = '<div class="q-hint">찾는 중…</div>';
    dcRpc('fn_quote_page_customer', { p_q: q, p_limit: 8 }).then(function(r){
      if(!r || !r.ok){ renderCustRows([], (r && r.error) ? ('불러오지 못했습니다 : ' + r.error) : '불러오지 못했습니다'); return; }
      renderCustRows(r.rows || [], r.note);
    }).catch(function(err){ renderCustRows([], '연결 실패 : ' + (err && err.message || err)); });
  }
  function pickCust(i){
    var x = CUST_ROWS[i]; if(!x || !QUOTE) return;
    var lq = x.last_quote || {};
    QUOTE.cust.name  = x.name || QUOTE.cust.name;
    if(x.phone) QUOTE.cust.phone = phoneFmt(x.phone);
    QUOTE.cust.addr    = x.addr || lq.addr || QUOTE.cust.addr;
    QUOTE.cust.birth   = x.birth || lq.birth || QUOTE.cust.birth;
    QUOTE.cust.carrier = lq.carrier || QUOTE.cust.carrier;
    QUOTE.cust.wedding = lq.wedding || QUOTE.cust.wedding;
    QUOTE.cust.movein  = lq.movein  || QUOTE.cust.movein;
    EDIT = true; syncEditBtn(); renderAll();
    toast('👤 ' + (x.name || '고객') + ' 정보를 채웠습니다'
      + (lq.no ? ' (지난 견적 ' + lq.no + ' 기준)' : '') + ' — 상품·금액은 새로 적으세요');
  }
  document.getElementById('qPanel').addEventListener('click', function(e){
    var t = e.target.closest('[data-qcust]');
    if(t){ pickCust(parseInt(t.getAttribute('data-qcust'), 10)); if(isPhone()) sheetOpen(false); return; }
    if(e.target.closest('#qCustBtn')) doCustSearch();
  });
  document.getElementById('qPanel').addEventListener('keydown', function(e){
    if(e.target && e.target.id === 'qCustQ' && e.key === 'Enter'){ e.preventDefault(); doCustSearch(); }
  });

  /* ═══════════ 9-c) 🔗 담당자 화면(store)에서 열기 ═══════════ */
  var PENDING_COUNSELOR = '';
  function qsGet(){ try { return new URLSearchParams(location.search || ''); } catch(e){ return null; } }
  function stripQuoteParams(){
    try {
      var u = new URL(location.href);
      ['no','v','name','phone','counselor','memo'].forEach(function(k){ u.searchParams.delete(k); });
      history.replaceState(null, '', u.pathname + (u.search || '') + (u.hash || ''));
    } catch(e){}
  }
  function applyCounselorName(nm){
    if(!nm) return false;
    var c = NAMECARDS.filter(function(x){ return String(x.name || '').trim() === nm; })[0];
    if(!c) return false;
    if(QUOTE && QUOTE.opt){ QUOTE.opt.namecardId = c.id; lsSet(LS_NC_SEL, c.id); }
    return true;
  }
  function applyPendingCounselor(){
    if(!PENDING_COUNSELOR) return;
    if(applyCounselorName(PENDING_COUNSELOR)){ PENDING_COUNSELOR = ''; renderAll(); }
  }
  function prefillCust(nm, ph, memo){
    if(!QUOTE || !QUOTE.cust) return;
    if(nm) QUOTE.cust.name = nm;
    if(ph) QUOTE.cust.phone = phoneFmt(ph);
    if(memo && !QUOTE.cust.memo) QUOTE.cust.memo = memo;
  }
  function openFromUrl(){
    var p = qsGet(); if(!p) return false;
    var no   = String(p.get('no') || '').trim(),
        nm   = String(p.get('name') || '').trim(),
        ph   = String(p.get('phone') || '').trim(),
        cs   = String(p.get('counselor') || '').trim(),
        memo = String(p.get('memo') || '').trim(),
        ver  = parseInt(p.get('v') || '0', 10) || 0;
    if(!no && !nm && !ph) return false;

    var prev = lsGet(LS_DRAFT);
    if(prev && prev.quote && draftMeaningful(prev.quote)) pushDraftSnap(prev.quote, '담당자 화면에서 열기', true);
    try { localStorage.removeItem(LS_DRAFT); } catch(e){}

    PENDING_COUNSELOR = cs;
    startBlank();
    prefillCust(nm, ph, memo);
    applyCounselorName(cs);
    renderAll();
    stripQuoteParams();

    if(!no){
      toast('🧾 ' + (nm || '고객') + ' — 담당자 화면에서 넘어왔습니다. 상품·금액을 채우고 발행하세요');
      /* 이름·번호가 왔으면 지난 이력도 자동으로 찾아 둔다 */
      if(nm || ph){ CUST_Q = ph ? ph.slice(-4) : nm; var qq = document.getElementById('qCustQ');
        if(qq){ qq.value = CUST_Q; doCustSearch(); } }
      return true;
    }
    toast('📄 견적 ' + no + ' 을(를) 불러오는 중…');
    loadHistory(function(){
      var hit = (ver ? HIST.filter(function(h){ return h.no === no && (h.version || 1) === ver; })[0] : null)
             || HIST.filter(function(h){ return h.no === no; })[0];
      if(hit && hit.quote){
        QUOTE = hit.quote; normalizeQuote(QUOTE);
        if(!QUOTE.meta) QUOTE.meta = { no: no, version: hit.version || 1, issuedAt: hit.issuedAt || '' };
        if(!QUOTE.meta.no){ QUOTE.meta.no = no; QUOTE.meta.version = QUOTE.meta.version || hit.version || 1; QUOTE.meta.issuedAt = QUOTE.meta.issuedAt || hit.issuedAt || ''; }
        EDIT = true; syncEditBtn();
        applyCounselorName(cs);
        renderAll();
        toast('📄 ' + no + ((hit.version > 1) ? ' v' + hit.version : '') + ' 불러옴 — 고치고 [💾 발행]하면 다음 판으로 저장됩니다');
      } else {
        /* 최근 100건 밖의 오래된 견적 — 번호로 직접 가져온다 */
        dcRpc('fn_quote_page_get', { p_no: no }).then(function(r){
          if(r && r.ok && r.quote){
            var q = (typeof r.quote === 'string') ? JSON.parse(r.quote) : r.quote;
            QUOTE = q; normalizeQuote(QUOTE);
            if(!QUOTE.meta) QUOTE.meta = { no: no, version: r.version || ver || 1, issuedAt: r.issuedAt || '' };
            if(!QUOTE.meta.no){ QUOTE.meta.no = no; QUOTE.meta.version = QUOTE.meta.version || r.version || ver || 1; QUOTE.meta.issuedAt = QUOTE.meta.issuedAt || r.issuedAt || ''; }
            EDIT = true; syncEditBtn(); applyCounselorName(cs); renderAll();
            toast('📄 ' + no + ' 불러옴 — 고치고 [💾 발행]하면 다음 판으로 저장됩니다');
          } else {
            toast('견적 ' + no + ' 을(를) 발행 내역에서 찾지 못했습니다 — 새 견적으로 엽니다', true);
          }
        }).catch(function(){ toast('견적 ' + no + ' 을(를) 불러오지 못했습니다 — 새 견적으로 엽니다', true); });
      }
    });
    return true;
  }

  modal.classList.add('open');
  if(lsGet('sh_quote_panel_off')) modal.classList.add('panel-off');

  /* 보안 코드를 아직 안 넣었으면 GAS 호출을 미룬다.
     잠금 화면은 덮개일 뿐 그 아래 스크립트는 그대로 돌기 때문에,
     미루지 않으면 네임카드·발행 내역을 "코드 없이" 부르게 되고
     GAS 쪽 확인(CODE_ENFORCE)을 켠 순간 그 호출들이 막힌다. */
  function shAuthed(){
    try { if(localStorage.getItem('dc_session')) return true;
          var e = localStorage.getItem('secure_auth_expiry');
          return !!(e && Date.now() < parseInt(e, 10)); }
    catch(err){ return true; }          /* localStorage 를 못 읽는 환경이면 예전처럼 바로 */
  }
  function whenAuthed(fn){
    if(shAuthed()) return fn();
    var t = setInterval(function(){ if(shAuthed()){ clearInterval(t); fn(); } }, 400);
  }

  whenAuthed(function initQuoteEntry(){
    if(openFromUrl()) return;                       // ① 담당자 화면에서 넘어온 주소
    var prevDraft = lsGet(LS_DRAFT);
    if(importHandoff(true)){                        // ② 계산기 핸드오프
      if(prevDraft && prevDraft.quote && draftMeaningful(prevDraft.quote)){
        pushDraftSnap(prevDraft.quote, '계산기 결과로 대체됨', true);
      }
      return;
    }
    if(prevDraft && prevDraft.quote && draftMeaningful(prevDraft.quote)){   // ③ 작성 중이던 견적
      QUOTE = prevDraft.quote; normalizeQuote(QUOTE); EDIT = true; syncEditBtn(); renderAll();
      toast('🕒 작성 중이던 견적을 복원했습니다 — 새로 시작하려면 [＋ 새 견적]');
      return;
    }
    startBlank();                                   // ④ 빈 견적
  });
  whenAuthed(function(){ loadNamecards(false).then(applyPendingCounselor, applyPendingCounselor); });
})();

</script>
</body>
</html>
