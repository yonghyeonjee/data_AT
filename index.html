<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>삼성스토어 시흥 · 고객센터</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ground:#F3F4F7;--surface:#fff;--line:#E4E7EE;--line-2:#CDD3DE;--ink:#141820;--ink-2:#2E3542;--muted:#646D7C;--faint:#98A1B0;
  --navy:#1428A0;--navy-ink:#0E1A6B;--navy-soft:#EAEEFB;--teal:#0F7B6C;--teal-soft:#E3F3F0;--red:#B3261E;--amber:#8A5D00;--amber-soft:#FBF1DC;
  --shadow:0 1px 2px rgba(20,24,32,.04),0 8px 28px rgba(20,24,32,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;background:var(--ground);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.hero{background:linear-gradient(135deg,#0B0F2E 0%,#141E64 60%,#1428A0 100%);color:#fff;padding:44px 20px 88px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(800px 400px at 80% 10%,rgba(122,140,232,.3),transparent 60%),radial-gradient(600px 300px at 10% 100%,rgba(15,123,108,.25),transparent 60%);pointer-events:none}
.hero .brand{position:relative;font-size:11px;letter-spacing:.3em;font-weight:700;color:#9FB0F5}
.hero h1{position:relative;font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}
.hero p{position:relative;font-size:14px;color:#B9C4EE}
.wrap{max-width:720px;margin:-56px auto 60px;padding:0 16px;position:relative}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:var(--surface);border-radius:16px;padding:20px 18px;box-shadow:var(--shadow);border:1.5px solid transparent;cursor:pointer;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:8px}
.tile:hover{transform:translateY(-2px);border-color:var(--navy)}
.tile.on{border-color:var(--navy);background:var(--navy-soft)}
.tile .ic{width:40px;height:40px;border-radius:11px;background:var(--navy-soft);color:var(--navy);display:flex;align-items:center;justify-content:center}
.tile.on .ic{background:var(--navy);color:#fff}
.tile .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:15.5px;letter-spacing:-.01em}
.tile small{font-size:12.5px;color:var(--muted);line-height:1.45}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.card .hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .hd b{font-size:16px}
.card .hd span{font-size:12.5px;color:var(--muted)}
.card .bd{padding:22px}
.f{margin-bottom:16px}
.f label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.f label .req{color:var(--red);margin-left:2px}
.f label .opt{color:var(--faint);font-weight:400;margin-left:6px;font-size:12px}
.in{width:100%;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:10px;outline:none;font-size:15px;background:#fff;transition:.15s}
.in:focus{border-color:var(--navy);box-shadow:0 0 0 4px var(--navy-soft)}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars{display:flex;gap:8px;font-size:30px;cursor:pointer;color:#D5D9E0;user-select:none}
.stars span.on{color:#E0A100}
.radio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio label{border:1.5px solid var(--line-2);border-radius:10px;padding:11px 12px;font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.radio label:has(input:checked){border-color:var(--navy);background:var(--navy-soft);color:var(--navy);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1.5px solid var(--line-2);border-radius:999px;background:#fff;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.agree{background:#F7F8FB;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.agree div{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.agree div:last-child{margin-bottom:0}
.agree input{margin-top:3px}
.btn{width:100%;padding:15px;background:var(--navy);color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:var(--navy-ink)} .btn:disabled{opacity:.6}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px;text-align:center}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.callout{background:var(--navy-soft);color:var(--navy-ink);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:16px}
#done{position:fixed;inset:0;background:rgba(11,15,46,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;padding:32px 24px;border-radius:16px;width:100%;max-width:360px;text-align:center}
.modal h2{font-size:20px;color:var(--teal);margin-bottom:8px}
.modal p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px}
.modal button{width:100%;padding:12px;background:var(--ink);color:#fff;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.foot{text-align:center;font-size:12px;color:var(--faint);margin-top:28px;line-height:1.8}
@media(max-width:520px){.tiles,.grid2,.radio{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style>
</head>
<body>
<div class="hero">
  <div class="brand">SAMSUNG STORE</div>
  <h1>삼성스토어 시흥 고객센터</h1>
  <p>무엇을 도와드릴까요? 아래에서 고르시면 담당 프로가 확인 후 연락드립니다.</p>
</div>

<div class="wrap">
  <div class="tiles" id="tiles">
    <button class="tile" data-t="리뷰·혜택"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 17.3 6.2 20.5l1.1-6.5L2.6 9.4l6.5-1L12 2.5l2.9 5.9 6.5 1-4.7 4.6 1.1 6.5z"/></svg></span><b>구매 리뷰 · 혜택 신청</b><small>구매하신 제품의 만족도와 리뷰를 남기고 혜택을 받으세요</small></button>
    <button class="tile" data-t="상담·견적"><span class="ic"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><b>상담 · 견적 예약</b><small>냉장고·세탁기·TV 등 구매 상담과 견적을 예약합니다</small></button>
    <button class="tile" data-t="설치·A/S"><span class="ic"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5l-9.9 9.9a2.1 2.1 0 0 1-3-3l9.9-9.9z"/><path d="M3 3l4 4"/></svg></span><b>설치 · A/S 문의</b><small>구매하신 제품의 설치 일정, 사용 문의, A/S 접수</small></button>
    <button class="tile" data-t="구독·렌탈"><span class="ic"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg></span><b>구독 · 렌탈 문의</b><small>AI 구독클럽, 정수기·복합기 렌탈과 정기 관리 문의</small></button>
  </div>

  <form class="card hidden" id="form" onsubmit="submitForm(event)">
    <div class="hd"><b id="fTitle"></b><span id="fSub"></span></div>
    <div class="bd">
      <div class="callout" id="fNote"></div>

      <div class="grid2">
        <div class="f"><label>성함 <span class="req">*</span></label><input class="in" id="name" placeholder="홍길동" required autocomplete="name" maxlength="40"></div>
        <div class="f"><label>휴대폰 번호 <span class="req">*</span></label><input class="in" type="tel" id="phone" placeholder="010-0000-0000" maxlength="13" oninput="hyphen(this)" required autocomplete="tel"></div>
      </div>

      <!-- 리뷰·혜택 -->
      <div id="sec-review">
        <div class="grid2">
          <div class="f"><label>구매 채널 <span class="req">*</span></label>
            <select class="in" id="channel"><option value="매장">시흥점 매장 방문</option><option value="자사몰">온라인 공식몰</option><option value="오픈마켓">스마트스토어 · 오픈마켓</option><option value="렌탈">렌탈 · 구독</option><option value="VMS">기업(B2B) · 복합기 소모품</option></select></div>
          <div class="f"><label>담당 프로 <span class="opt">아시면</span></label>
            <select class="in" id="handler"><option value="">모름 · 온라인</option><option>장성원</option><option>차효범</option><option>장은희</option><option>강민정</option><option>박은지</option><option>송희봉</option><option>권혁찬</option><option>김규완</option><option>이수혁</option><option>최지영</option><option>최태웅</option></select></div>
        </div>
        <div class="f"><label>구매하신 제품 <span class="req">*</span></label><input class="in" id="product" placeholder="예: 갤럭시 Z 폴드8, 비스포크 냉장고"></div>
        <div class="f"><label>만족도</label><div class="stars" id="stars"><span class="on">★</span><span class="on">★</span><span class="on">★</span><span class="on">★</span><span class="on">★</span></div></div>
        <div class="f"><label>리뷰 작성</label>
          <div class="radio">
            <label><input type="radio" name="rv" value="작성완료" checked> 영수증·포토 리뷰 완료</label>
            <label><input type="radio" name="rv" value="작성예정"> 3일 내 작성 예정</label>
            <label><input type="radio" name="rv" value="블로그/SNS"> 블로그·SNS 후기</label>
            <label><input type="radio" name="rv" value="미작성"> 리뷰 미작성</label>
          </div></div>
        <div class="f"><label>리뷰 링크 또는 한줄 후기 <span class="opt">선택</span></label><textarea class="in" id="review" placeholder="리뷰 URL 또는 이용 후기"></textarea></div>
        <div class="f"><label>다음에 관심 있는 제품 <span class="opt">선택</span></label><input class="in" id="next" placeholder="예: 사운드바, 워치, 정수기 필터"></div>
      </div>

      <!-- 상담·견적 / 설치·A/S / 구독·렌탈 -->
      <div id="sec-inquiry" class="hidden">
        <div class="f"><label id="lblInterest">관심 제품 <span class="req">*</span></label>
          <div class="chips" id="interest"></div>
          <input class="in" id="interestEtc" placeholder="직접 입력 (모델명·제품명)" style="margin-top:8px"></div>
        <div class="grid2">
          <div class="f"><label>희망 연락·방문 시간 <span class="opt">선택</span></label><input class="in" id="preferred" placeholder="예: 평일 오후 2시 이후, 토요일 오전"></div>
          <div class="f"><label>담당 프로 <span class="opt">아시면</span></label>
            <select class="in" id="handler2"><option value="">배정 요청</option><option>장성원</option><option>차효범</option><option>장은희</option><option>강민정</option><option>박은지</option><option>송희봉</option><option>권혁찬</option><option>김규완</option><option>이수혁</option><option>최지영</option><option>최태웅</option></select></div>
        </div>
        <div class="f"><label id="lblMsg">문의 내용 <span class="opt">선택</span></label><textarea class="in" id="message" placeholder="궁금한 점, 설치 환경, 현재 사용 중인 제품 등을 적어 주세요" maxlength="1000"></textarea></div>
      </div>

      <div class="agree">
        <div><input type="checkbox" id="privacy" checked required><label for="privacy"><b>[필수]</b> 개인정보 수집·이용 동의 (상담·혜택 안내 목적, 1년 보관)</label></div>
        <div><input type="checkbox" id="marketing"><label for="marketing"><b>[선택]</b> 맞춤 프로모션·재구매 할인 정보 수신 동의</label></div>
      </div>
      <button type="submit" class="btn" id="btn">접수하기</button>
      <div class="err" id="err"></div>
    </div>
  </form>

  <div class="foot">삼성스토어 시흥 · 접수 내용은 담당 프로 확인 후 영업시간 내에 연락드립니다.</div>
</div>

<div id="done" class="hidden"><div class="modal"><h2>접수되었습니다</h2><p id="doneMsg">담당 프로가 확인 후<br>연락드리겠습니다.</p><button onclick="location.reload()">확인</button></div></div>

<script>
const sb = window.supabase.createClient("https://wdahskrcpjooqhwwxjiu.supabase.co","sb_publishable_O74WxjCsacx4G7Dtemgvlw_M9_6VtlW");
const $=id=>document.getElementById(id);
const TYPES={
  '리뷰·혜택':{sub:'리뷰를 남기신 분께 혜택을 드립니다',note:'구매 후 리뷰를 작성하셨거나 작성 예정이시면 신청해 주세요. 담당 프로가 확인 후 혜택을 안내드립니다.',
    interest:null},
  '상담·견적':{sub:'구매 상담 · 견적 · 방문 예약',note:'관심 제품과 편한 시간을 남겨 주시면 담당 프로가 연락드려 견적과 혜택을 안내합니다. 매장 방문 예약도 여기서 하시면 됩니다.',
    interest:['냉장고·김치냉장고','세탁기·건조기','TV·사운드바','에어컨·공기청정기','청소기','주방가전','갤럭시 폰·태블릿','노트북·모니터','기타']},
  '설치·A/S':{sub:'설치 일정 · 사용 문의 · A/S',note:'구매하신 제품의 설치 일정 조율, 사용 방법, 고장 접수를 도와드립니다. 제품명과 증상을 적어 주시면 빠릅니다.',
    interest:['설치 일정 문의','사용 방법 문의','고장·A/S 접수','반품·교환 문의','기타'], lbl:'문의 종류', msgLbl:'제품명과 내용'},
  '구독·렌탈':{sub:'AI 구독클럽 · 렌탈 · 정기 관리',note:'월 이용료로 쓰는 AI 구독클럽, 정수기·복합기 렌탈, 토너·필터 정기 교체 관리를 안내드립니다.',
    interest:['AI 구독클럽 (가전)','정수기 렌탈','복합기·프린터 렌탈','토너·필터 정기 관리','기타']},
};
let TYPE=null, rating=5, interestSel=null;
document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>pick(t.dataset.t)));
function pick(t){
  TYPE=t; const c=TYPES[t];
  document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  $('form').classList.remove('hidden'); $('fTitle').textContent=t; $('fSub').textContent=c.sub; $('fNote').textContent=c.note;
  const isReview = t==='리뷰·혜택';
  $('sec-review').classList.toggle('hidden',!isReview); $('sec-inquiry').classList.toggle('hidden',isReview);
  $('product').required=isReview;
  if(!isReview){
    $('lblInterest').innerHTML=(c.lbl||'관심 제품')+' <span class="req">*</span>';
    $('lblMsg').innerHTML=(c.msgLbl||'문의 내용')+' <span class="opt">선택</span>';
    interestSel=null; $('interest').innerHTML=c.interest.map(x=>`<button type="button" class="chip" onclick="pickInterest(this)">${x}</button>`).join('');
  }
  $('btn').textContent = isReview?'혜택 신청하기':'접수하기';
  setTimeout(()=>$('form').scrollIntoView({behavior:'smooth',block:'start'}),50);
}
function pickInterest(el){ interestSel=el.textContent; document.querySelectorAll('#interest .chip').forEach(x=>x.classList.toggle('on',x===el)); }
$('stars').addEventListener('click',e=>{ const s=[...$('stars').children]; const i=s.indexOf(e.target); if(i<0)return; rating=i+1; s.forEach((x,j)=>x.classList.toggle('on',j<=i)); });
function hyphen(el){ el.value=el.value.replace(/[^0-9]/g,'').replace(/^(\d{0,3})(\d{0,4})(\d{0,4})$/,'$1-$2-$3').replace(/-{1,2}$/,''); }
async function submitForm(e){
  e.preventDefault(); const b=$('btn'); $('err').textContent='';
  const isReview=TYPE==='리뷰·혜택';
  let p={ request_type:TYPE, customer_name:$('name').value.trim(), customer_phone:$('phone').value.trim(),
    consent_privacy:$('privacy').checked, consent_marketing:$('marketing').checked };
  if(isReview){
    Object.assign(p,{ channel_type:$('channel').value, handler:$('handler').value, product_name:$('product').value.trim(), rating,
      review_status:document.querySelector('input[name=rv]:checked').value, review_url:$('review').value.trim(), next_product:$('next').value.trim() });
  } else {
    const it=(interestSel && interestSel!=='기타') ? interestSel : $('interestEtc').value.trim();
    if(!it){ $('err').textContent=(TYPES[TYPE].lbl||'관심 제품')+'을 골라 주세요'; return; }
    Object.assign(p,{ channel_type:'매장', handler:$('handler2').value, product_name:it, next_product:interestSel==='기타'?'':$('interestEtc').value.trim(),
      message:$('message').value.trim(), preferred_at:$('preferred').value.trim() });
  }
  b.disabled=true; b.textContent='접수 중…';
  const {error}=await sb.rpc('fn_submit_customer',{p_data:p});
  if(error){ $('err').textContent=error.message.replace(/^.*?: /,''); }
  else { $('doneMsg').innerHTML = isReview ? '담당 프로가 확인 후<br>혜택을 안내해 드리겠습니다.' : '담당 프로가 확인 후<br>남겨주신 번호로 연락드리겠습니다.'; $('done').classList.remove('hidden'); }
  b.disabled=false; b.textContent=isReview?'혜택 신청하기':'접수하기';
}
</script>
</body>
</html>
