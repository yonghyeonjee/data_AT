<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>견적서 · 삼성스토어 시흥</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#151A23;--ink-2:#39414F;--muted:#6B7280;--faint:#9AA1AC;--line:#E6E9EF;--line-2:#D5DAE3;
  --navy:#1B2A5B;--accent:#2F5BEA;--accent-soft:#EEF2FF;--ok:#0F7B6C;--bad:#A6342A;--bg:#F4F6FA;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 2px 14px;color:var(--navy);font-weight:800;letter-spacing:-.02em}
.brand small{margin-left:auto;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:13px;margin:0}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{flex:0 0 88px;color:var(--muted);font-weight:600;font-size:13px}
.kv span{flex:1;text-align:right;font-weight:600}
.item{border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:10px;background:#fff}
.item .t{font-weight:800;font-size:16px;letter-spacing:-.02em;margin-bottom:2px}
.item .m{color:var(--muted);font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.item .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-top:1px dashed var(--line);margin-top:8px}
.item .row b{color:var(--muted);font-weight:600;font-size:13px}
.big{background:linear-gradient(135deg,#1B2A5B,#2F5BEA);color:#fff;border:0}
.big .lb{opacity:.82;font-size:13px;font-weight:600}
.big .v{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.big .v small{font-size:15px;font-weight:700;opacity:.9}
.big .sec{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);display:flex;justify-content:space-between;font-size:14px}
.note{color:var(--muted);font-size:12.5px;line-height:1.65}
.warn{background:#FFF4D6;border-color:#F0DFAC;color:#6D5100}
.expired{background:#FFF4D6;border-color:#E8CE86;color:#6D5100}
.expired .ex-t{font-weight:800;font-size:16px;letter-spacing:-.02em}
.big.pastdue{background:linear-gradient(135deg,#5A6376,#7C8698)}
.kv span.over{color:var(--bad)} .kv span.soon{color:#8A6300}
.contact{text-align:center}
.contact .ct{font-weight:800;font-size:17px;letter-spacing:-.02em}
.contact .cr{color:var(--muted);font-size:13px;margin-top:2px}
.contact .btn.sub{width:100%;margin-top:8px;min-height:46px;background:#fff;color:var(--ink-2);font-size:15px}
.contact .btn.tel{width:100%;margin-top:12px;font-size:17px;min-height:54px;letter-spacing:-.01em}
.expired .btn.tel{width:100%;margin-top:12px;min-height:52px;font-size:16px;background:#6D5100;border-color:#6D5100;color:#fff}
.err{text-align:center;padding:48px 20px}
.err .ico{font-size:40px}
.err h2{font-size:18px;margin:12px 0 6px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{flex:1 1 150px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1.5px solid var(--line-2);background:#fff;color:var(--ink-2);border-radius:12px;font-weight:700;font-size:15px;
  text-decoration:none;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:active{transform:translateY(1px)}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:22px;line-height:1.8}
.skel{height:14px;background:linear-gradient(90deg,#EDF0F5,#F6F8FB,#EDF0F5);border-radius:6px;margin:9px 0;animation:sh 1.2s infinite}
@keyframes sh{0%{opacity:.7}50%{opacity:1}100%{opacity:.7}}
@media print{
  body{background:#fff} .wrap{max-width:none;padding:0} .btnrow,.noprint{display:none!important}
  .card{break-inside:avoid;box-shadow:none;border-color:#CCC;margin-bottom:10px}
  .big{background:#1B2A5B!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">SAMSUNG&amp;TECH · 시흥점 <small>견적서</small></div>
  <div id="app">
    <div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div>
  </div>
</div>
<script>
const SB_URL="https://wdahskrcpjooqhwwxjiu.supabase.co";
const SB_KEY="sb_publishable_O74WxjCsacx4G7Dtemgvlw_M9_6VtlW";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>n==null||n===''?'-':Number(n).toLocaleString('ko-KR')+'원';
const tok=new URLSearchParams(location.search).get('t')||'';

/* 기한이 끝나도 막다른 길로 두지 않는다 — 어디로 연락하면 되는지가 반드시 남는다 */
function contactBox(d){
  d=d||{}; const tel=d.tel||'031-8042-3166';
  /* 견적서에 찍힌 네임카드 그대로 — 직급·부서·휴대폰 */
  const role = [d.counselor_role, d.counselor_title].filter(Boolean).join(' · ');
  return `<div class="card contact">
      ${d.counselor?`<div class="ct"><b>${esc(d.counselor)}</b> ${esc(d.counselor_role||'프로')}</div>
        ${role?`<div class="cr">${esc(d.counselor_title||'')}</div>`:''}`
      :`<div class="ct">${esc(d.store_name||'삼성스토어 시흥점')}</div>`}
      <p class="note" style="margin:8px 0 0">${esc(d.note||'기존 견적 금액 조회 및 추가 상담은 '+tel+' 으로 연락해 주세요.')}</p>
      <a class="btn pri tel" href="tel:${esc(tel.replace(/[^0-9+]/g,''))}">📞 ${esc(tel)} 전화하기</a>
      ${d.store_tel&&d.store_tel!==tel?`<a class="btn sub tel" href="tel:${esc(String(d.store_tel).replace(/[^0-9+]/g,''))}">매장 ${esc(d.store_tel)}</a>`:''}
      ${d.no?`<p class="note" style="margin:10px 0 0">문의하실 때 견적번호 <b>${esc(d.no)}</b> 를 말씀해 주세요.</p>`:''}
      ${d.store_addr?`<p class="note" style="margin:6px 0 0">${esc(d.store_name||'')} · ${esc(d.store_addr)}</p>`:''}
    </div>`;
}
function err(ico,title,body,d){
  $('app').innerHTML=`<div class="card err"><div class="ico">${ico}</div><h2>${esc(title)}</h2>
    <p class="note">${body}</p></div>`
    + contactBox(d)
    + `<div class="foot">${esc((d&&d.store_name)||'삼성스토어 시흥점')} · 삼성전자 공식 판매점</div>`;
}

(async function(){
  if(!tok) return err('🔗','주소가 올바르지 않습니다','담당자가 보내 드린 링크를 그대로 눌러 주세요.');
  let d;
  try{ const r=await sb.rpc('fn_quote_public',{p_token:tok}); if(r.error) throw new Error(r.error.message); d=r.data; }
  catch(e){ return err('⚠️','지금 열 수 없습니다','잠시 뒤 다시 시도해 주세요.<br><span style="color:#9AA1AC">'+esc(e.message)+'</span>'); }

  if(!d || !d.ok){
    if(d && d.reason==='expired') return err('⏳','열람 기간이 지난 견적서입니다',
      `${esc(d.expired_at||'')} 까지 보실 수 있었습니다.<br><b>견적 내용은 그대로 남아 있습니다.</b> 연락 주시면 바로 다시 보내 드립니다.`, d);
    if(d && d.reason==='revoked') return err('🔒','이 링크는 사용이 중지되었습니다',
      '새 견적으로 다시 보내 드리겠습니다.', d);
    return err('🔎','견적서를 찾을 수 없습니다','링크가 잘못되었거나 지워진 견적서입니다.', d);
  }
  render(d);
})();

function render(d){
  const q=d.quote||{}, cust=q.cust||{}, items=(q.items||[]).filter(x=>!x.hidden);
  const sub=(d.type||cust.type||'')==='구독' || !!d.monthly;
  const H=[];

  if(d.valid_over) H.push(`<div class="card expired">
    <div class="ex-t">⏳ 이 견적의 유효기간이 지났습니다</div>
    <p class="note" style="color:inherit;margin:6px 0 0">
      <b>${esc(d.valid_until||'')}</b> 까지였습니다. 아래 금액은 <b>그때 기준</b>이라 지금과 다를 수 있습니다.<br>
      ${esc(d.note||'')}</p>
    <a class="btn pri tel" href="tel:${esc(String(d.tel||'').replace(/[^0-9+]/g,''))}">📞 ${esc(d.tel||'')} 전화하기</a>
  </div>`);
  H.push(`<div class="card">
    <h1>${esc(d.name||'고객')} 님 견적서</h1>
    <p class="sub">${esc(d.no)}${d.ver>1?` · ${d.ver}차`:''} · ${esc(d.issued_at||'')}${d.counselor?` · 담당 ${esc(d.counselor)} 프로`:''}</p>
    <div style="margin-top:14px">
      ${cust.phone||d.phone?`<div class="kv"><b>연락처</b><span>${esc(d.phone||'')}</span></div>`:''}
      ${cust.type?`<div class="kv"><b>구매 방식</b><span>${esc(cust.type)}</span></div>`:''}
      ${cust.movein?`<div class="kv"><b>입주 예정</b><span>${esc(cust.movein)}</span></div>`:''}
      ${cust.wedding?`<div class="kv"><b>예식일</b><span>${esc(cust.wedding)}</span></div>`:''}
      ${d.card?`<div class="kv"><b>카드 할인</b><span>${esc(d.card)}</span></div>`:''}
      ${d.valid_until?`<div class="kv"><b>견적 유효기간</b><span class="${d.valid_over?'over':(d.valid_d<=3?'soon':'')}">${esc(d.valid_until)}${d.valid_over?' (지남)':(d.valid_d===0?' (오늘까지)':` (${d.valid_d}일 남음)`)}</span></div>`:''}
    </div></div>`);

  /* 금액 — 제일 크게, 제일 먼저 보이게 */
  H.push(`<div class="card big${d.valid_over?' pastdue':''}">
    <div class="lb">${sub?'월 예상 납부액':'최종 금액'}</div>
    <div class="v">${sub? (won(d.monthly).replace('원','')+'<small>원 / 월</small>') : won(d.final)}</div>
    ${d.total?`<div class="sec"><span>정상가</span><b>${won(d.total)}</b></div>`:''}
    ${d.benefit?`<div class="sec"><span>받으신 혜택</span><b>−${Number(d.benefit).toLocaleString('ko-KR')}원</b></div>`:''}
    ${sub&&d.final?`<div class="sec"><span>혜택 적용가</span><b>${won(d.final)}</b></div>`:''}
    ${d.real_monthly&&d.real_monthly!==d.monthly?`<div class="sec"><span>카드 할인까지 적용 시</span><b>월 ${won(d.real_monthly)}</b></div>`:''}
  </div>`);

  if(items.length) H.push(`<div class="card">
    <div style="font-weight:800;font-size:15px;letter-spacing:-.02em">상품 ${items.length}건</div>
    ${items.map(it=>`<div class="item">
      <div class="t">${esc(it.name||'')}</div>
      ${it.model?`<div class="m">${esc(it.model)}</div>`:''}
      ${it.months?`<div class="row"><b>약정</b><span>${esc(it.months)}개월</span></div>`:''}
      ${it.monthly?`<div class="row"><b>월 요금</b><span>${won(it.monthly)}</span></div>`:''}
      ${it.total?`<div class="row"><b>총액</b><span>${won(it.total)}</span></div>`:''}
      ${it.care&&it.care!=='-'?`<div class="row"><b>케어</b><span>${esc(it.care)}</span></div>`:''}
      ${it.cycle&&it.cycle!=='-'?`<div class="row"><b>방문 주기</b><span>${esc(it.cycle)}</span></div>`:''}
      ${it.cardDesc?`<div class="row"><b>카드</b><span style="font-weight:600;font-size:13px">${esc(it.cardDesc)}</span></div>`:''}
      ${it.note?`<div class="row"><b>비고</b><span style="font-weight:600;font-size:13px">${esc(it.note)}</span></div>`:''}
    </div>`).join('')}
  </div>`);

  if(d.memo||cust.memo) H.push(`<div class="card"><div class="note">${esc(d.memo||cust.memo)}</div></div>`);

  H.push(`<div class="card warn"><div class="note" style="color:inherit">
    표시된 금액은 <b>제조사 정책·재고·카드 조건</b>에 따라 바뀔 수 있으며, 최종 금액은 계약 시 확정됩니다.
    ${d.valid_until&&!d.valid_over?`<br>이 견적은 <b>${esc(d.valid_until)}</b> 까지 유효합니다.`:''}
  </div></div>`);
  H.push(contactBox(d));

  H.push(`<div class="btnrow noprint">
    <button class="btn pri" onclick="window.print()">🖨 인쇄 · PDF 저장</button>
    <button class="btn" onclick="shareThis()">↗ 공유하기</button>
  </div>`);

  H.push(`<div class="foot">${esc(d.store_name||'삼성스토어 시흥점')} · 삼성전자 공식 판매점</div>`);

  $('app').innerHTML=H.join('');
  document.title=`${d.name||''} 님 견적서 · ${d.no}`;
}

async function shareThis(){
  const t=document.title, u=location.href;
  if(navigator.share){ try{ await navigator.share({title:t, text:t, url:u}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(u); alert('링크를 복사했습니다'); }
  catch(e){ prompt('아래 주소를 복사하세요', u); }
}
</script>
</body>
</html>
