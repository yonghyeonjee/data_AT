/* ═══ 고객용 껍데기 ═══ */
:root{--c-ink:#151A23;--c-mut:#6B7280;--c-line:#E6E9EF;--c-navy:#1B2A5B;--c-bad:#A6342A;--c-bg:#EEF1F6}
html,body{margin:0;padding:0}
body{background:var(--c-bg);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--c-ink);-webkit-text-size-adjust:100%}
.cwrap{max-width:calc(210mm + 32px);margin:0 auto;padding:14px 16px 56px}
.cbrand{display:flex;align-items:center;gap:8px;padding:4px 2px 12px;color:var(--c-navy);font-weight:800;letter-spacing:-.02em;font-size:15px}
.cbrand small{margin-left:auto;color:var(--c-mut);font-weight:600;font-size:12px;letter-spacing:0}
.cbox{background:#fff;border:1px solid var(--c-line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.cbox.warn{background:#FFF4D6;border-color:#E8CE86;color:#6D5100}
.cbox.warn .t{font-weight:800;font-size:16px;letter-spacing:-.02em}
.cbox .note{color:var(--c-mut);font-size:12.5px;line-height:1.7;margin:0}
.cbox.warn .note{color:inherit}
.cbtn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:52px;margin-top:12px;
  border:1.5px solid var(--c-navy);background:var(--c-navy);color:#fff;border-radius:12px;font-weight:700;
  font-size:16px;text-decoration:none;cursor:pointer;font-family:inherit}
.cbtn.ghost{background:#fff;color:var(--c-ink);border-color:#D5DAE3;min-height:46px;font-size:15px}

  function calcItem(it, pm){
    if(!it.auto) it.auto = { total: true, card: true };
    if(!it.disc) it.disc = {};
    var m = Math.max(0, Math.round(num(it.months)));
    var monthly = num(it.monthly);
    // ① 총 구독료 = 월 구독료 × 기간
    var total = (it.auto.total !== false) ? monthly * m : num(it.total);
    it.total = total;
    // ② 제휴카드 청구할인 = 월 청구할인 × 기간
    var cardMonthly = num(it.cardMonthly);
    var card;
    if(it.auto.card !== false){ card = cardMonthly * m; }
    else { card = num(it.disc.card); cardMonthly = m > 0 ? Math.round(card / m) : 0; it.cardMonthly = cardMonthly; }
    it.disc.card = card;
    var d = it.disc;
    var sub = num(d.sub), multiRaw = num(d.multi), pre = num(d.prepay), point = num(d.point);
    // ③ 다품목 미해당 상품은 다품목 할인 제외 (원본 값은 보존)
    var multi = (it.multiOk === false) ? 0 : multiRaw;
    var cons = num(it.consumable), gift = num(it.giftcard), preAmt = num(it.prepayAmt);
    // ④ 총 혜택 · 최종 혜택가 — 포인트는 표기 방식과 무관하게 항상 차감,
    //    선납금은 DPS 월 구독료에 선납 할인이 이미 반영되어 있으므로 총 지불액에 "가산"
    var benefit = sub + multi + pre + card + point + cons + gift;
    var finalP = Math.max(0, total - benefit) + preAmt;
    // ⑤ 월 단위 지표
    var payM = m > 0 ? Math.round((total - sub - multi - pre) / m) : 0;                 // 할인 후 월 청구액(카드 전)
    var afterCardM = Math.max(0, payM - cardMonthly);                                    // 체감 구독료 = 월구독료 − 월카드할인
    var remainM = m > 0 ? Math.max(0, Math.round((total - sub - multi - pre - card - preAmt) / m)) : 0;
    var realM = m > 0 ? Math.max(0, Math.round((finalP - preAmt) / m)) : 0;
    var freeMonths = (point > 0 && remainM > 0) ? Math.floor(point / remainM) : 0;
    return { m: m, monthly: monthly, total: total, sub: sub, multi: multi, multiRaw: multiRaw, pre: pre, point: point,
             card: card, cardMonthly: cardMonthly, cons: cons, gift: gift, preAmt: preAmt,
             benefit: benefit, finalP: finalP, payM: payM, afterCardM: afterCardM,
             remainM: remainM, realM: realM, freeMonths: freeMonths };
  }

  function calcTotals(q){
    var pm = q.opt.pointMode, T = { total: 0, sub: 0, multi: 0, pre: 0, point: 0, card: 0, cardM: 0, cons: 0, gift: 0, extra: 0, benefit: 0, finalP: 0,
      monthly: 0, afterCardM: 0, realM: 0, remainM: 0, preAmt: 0, maxM: 0, count: 0, multiCount: 0 };
    q.items.forEach(function(it){
      if(it.hidden) return;
      var c = calcItem(it, pm);
      T.count++; T.total += c.total; T.sub += c.sub; T.multi += c.multi; T.pre += c.pre; T.point += c.point;
      T.card += c.card; T.cardM += c.cardMonthly; T.cons += c.cons; T.gift += c.gift; T.preAmt += c.preAmt; T.finalP += c.finalP;
      T.monthly += c.monthly; T.afterCardM += c.afterCardM; T.realM += c.realM; T.remainM += c.remainM;
      if(it.multiOk) T.multiCount++;
      if(c.m > T.maxM) T.maxM = c.m;
    });
    (q.extra || []).forEach(function(e){ T.extra += num(e.amount); });
    T.finalP = Math.max(0, T.finalP - T.extra);
    /* 💵 이벤트 리워드 1% — 최종가에 실제 차감 반영 (기준: 리워드 반영 전 혜택가 · 천원 올림) */
    T.reward = 0;
    if(q.opt.rewardOn){
      T.reward = Math.ceil(Math.max(0, T.finalP) * 0.01 / 1000) * 1000;
      T.finalP = Math.max(0, T.finalP - T.reward);
    }
    /* 공통 멤버십 포인트 (DPS 전체 합산 입력) — 합계에서만 차감, 상품별 칸과 병행 */
    T.pointItems = T.point;
    T.pointCommon = num(q.opt.pointCommon);
    if(T.pointCommon > 0){ T.point += T.pointCommon; T.finalP = Math.max(0, T.finalP - T.pointCommon); }
    T.benefit = T.sub + T.multi + T.pre + T.card + T.point + T.cons + T.gift + T.extra + T.reward;
    T.pct = T.total > 0 ? (T.benefit / T.total * 100) : 0;
    return T;
  }

    var monthly = Math.round(T.monthly);                       // ① 월 구독료 합계

    var netM    = Math.max(0, monthly - discM - cardM);        // ③ 월 구독료 혜택가 (상품 카드의 출금액과 동일 기준)
    var realM   = Math.max(0, Math.round(T.realM - (num(q.opt.pointCommon) || 0) / m)); // ④ 월 체감 구독료 (공통 포인트까지 반영 · 선납금 제외)
    var hasPre  = T.preAmt > 0;
    var afterPreM = Math.round(T.remainM);                     // 선납 후 남은 월 납입 (상품별 합)
    var pointOn = (q.opt.pointMode === 'replace') && T.point > 0;
    function c(k, v, cls, sub){
      return '<div class="c' + (cls === 'big' ? ' big' : '') + '"><div class="k">' + k + '</div>'
        + '<div class="v' + (cls === 'minus' ? ' minus' : '') + '">' + v + '</div>'
        + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
    }
    var S = (q.opt.show || {});
    var cells = '', n = 0;
    cells += c('월 구독료 합계', won(monthly)); n++;
    if(discM > 0){ cells += c('구독료 할인 (월 환산)', '-' + won(discM), 'minus'); n++; }

  function paginate(container, blocks, footHtml, q, pageCls){
    var pages = [];
    function newPage(){
      var p = document.createElement('div');
      p.className = 'q-page' + pageCls;
      p.innerHTML = '<div class="q-pg-body">' + (pages.length ? contHeaderHtml(q) : '') + '</div><div class="q-pg-end"></div>' + runFootHtml(q);
      container.appendChild(p); pages.push(p); return p;
    }
    function over(p){ return p.scrollHeight > p.clientHeight + 1; }
    function minKids(){ return pages.length > 1 ? 1 : 0; }
    var p = newPage(), body = p.firstChild;
    blocks.forEach(function(html){
      if(!html) return;
      var tmp = document.createElement('div'); tmp.innerHTML = html;
      var el = tmp.firstChild; if(!el) return;
      body.appendChild(el);
      if(over(p) && body.children.length > minKids() + 1){
        body.removeChild(el);
        p = newPage(); body = p.firstChild; body.appendChild(el);
      }
    });
    var end = p.querySelector('.q-pg-end');
    end.innerHTML = footHtml;
    if(pages.length === 1){ var run1 = p.querySelector('.q-pg-run'); if(run1) run1.remove(); }   // 1장 후보: 러닝 푸터 없이 판정 (하단 매장 정보와 중복)
    if(over(p)){
      if(pages.length === 1 && !p.querySelector('.q-pg-run')) p.insertAdjacentHTML('beforeend', runFootHtml(q));
      end.innerHTML = '';
      var carry = [];
      while(body.lastChild && body.children.length > minKids() + 1 && /q-note|q-memo/.test(body.lastChild.className || '')){
        carry.unshift(body.lastChild); body.removeChild(body.lastChild);
      }
      p = newPage(); body = p.firstChild;
      carry.forEach(function(c){ body.appendChild(c); });
      p.querySelector('.q-pg-end').innerHTML = footHtml;
    }
    if(pages.length > 1){
      if(!pages[0].querySelector('.q-pg-run')) pages[0].insertAdjacentHTML('beforeend', runFootHtml(q));
      pages.forEach(function(pg, i){ pg.querySelector('.pn').textContent = (i + 1) + ' / ' + pages.length; });
    }
    return pages.length;
  }

    var payBand = (S.payband !== false) ? payBandHtml(q, T) : '';
    blocks.push(payBand);          // ★ 매달 내시는 금액 (한눈에 보기)
    /* 상품 카드: 1개(비편집)=전폭 2단, 여러 개=한 줄에 2개씩(홀수 마지막은 전폭), ✏️ 수정 모드=1개씩 전체폭 */
    var list = [];
    q.items.forEach(function(it, i){ if(it.hidden && !EDIT) return; list.push({ it: it, i: i }); });
    var one = visible.length === 1;                 // 편집 중에도 미리보기와 같은 레이아웃
    if(one){
      list.forEach(function(x){ blocks.push('<div class="q-prods one">' + prodHtml(x.it, x.i, pm) + '</div>'); });
    } else {
      for(var r = 0; r < list.length; r += 2){
        if(list[r + 1]) blocks.push('<div class="q-prods">' + prodHtml(list[r].it, list[r].i, pm) + prodHtml(list[r + 1].it, list[r + 1].i, pm) + '</div>');
        else blocks.push('<div class="q-prods one">' + prodHtml(list[r].it, list[r].i, pm) + '</div>');   // 홀수 마지막 카드는 전폭(2단)
      }
    }
    if(EDIT) blocks.push('<div class="q-addrow no-print"><button type="button" class="q-addbtn" data-qadditem="1">＋ 상품 추가</button></div>');
    var mo = T.maxM;
    var sumBox = '';
    if(S.sumBox || EDIT){
      sumBox = '<div class="q-box"><h3>💰 총비용 비교 시뮬레이터' + (T.count > 1 ? ' <span style="font-weight:600;color:#666">(' + T.count + '개 상품 합계)</span>' : '') + '</h3><table class="q-tbl">';
      sumBox += '<tr class="tot"><th>총 구독료 합계</th><td class="num">' + won(T.total) + '</td></tr>';
      sumBox += srow('구독료 할인', T.sub);
      sumBox += '<tr><th>다품목 구독 할인 <span style="font-weight:500;color:#666">(대상 ' + T.multiCount + '/' + T.count + '개)</span></th><td class="num' + (T.multi > 0 ? '' : ' mut') + '">' + (T.multi > 0 ? '-' + won(T.multi) : '미해당') + '</td></tr>';
      sumBox += srow('선납 할인', T.pre);
      var pmSumTag = pm === 'replace' ? '' : ' · 별도 적립';
      if(T.pointItems > 0) sumBox += '<tr><th>⭐ 삼성전자 멤버십 포인트 <span style="font-weight:500;color:#666">(상품별' + pmSumTag + ')</span></th><td class="num">-' + won(T.pointItems) + '</td></tr>';
      if(EDIT || T.pointCommon > 0) sumBox += '<tr><th>⭐ 멤버십 포인트 공통 <span style="font-weight:500;color:#666">(전체 합산 입력' + pmSumTag + ')</span>' + pmChip() + '</th><td class="num">' + (EDIT ? cell('opt.pointCommon', T.pointCommon, 'imp') : '-' + won(T.pointCommon)) + '</td></tr>';
      sumBox += srow('제휴카드 청구할인' + (q.opt.card ? ' <span style="font-weight:500;color:#666">(' + esc(q.opt.card) + ')</span>' : ''), T.card);
      sumBox += srow('소모품', T.cons) + srow('상품권', T.gift);
      if(T.reward > 0) sumBox += '<tr><th>💵 이벤트 리워드 (1%)</th><td class="num">-' + won(T.reward) + '</td></tr>';
      var extraShown = 0;
      (q.extra || []).forEach(function(e, i){
        var v = num(e.amount);
        if(v <= 0 && !(EDIT && e._open)) return;        // 작성하지 않은 기타 혜택은 표시하지 않음
        extraShown++;
        sumBox += '<tr><th>' + (EDIT ? tcell('extra.' + i + '.label', e.label) : esc(e.label)) + '</th><td class="num">' + (EDIT ? cell('extra.' + i + '.amount', v) : '-' + won(v)) + '</td></tr>';
      });
      if(EDIT && !extraShown) sumBox += '<tr class="no-print"><th colspan="2" style="text-align:center;background:#fff"><button type="button" class="q-x" data-qextra="1" style="margin-left:0">＋ 기타 혜택 행 추가</button></th></tr>';
      sumBox += '<tr class="ben"><th>총 혜택 합계</th><td class="num">-' + won(T.benefit) + '</td></tr>';
      if(T.preAmt > 0){
        /* 소계: 여기까지가 할인 적용가 → 선납금 가산 → 총 지불액 (검산 가능하게) */
        sumBox += '<tr><th style="font-weight:700">혜택 적용가 <span style="font-weight:500;color:#666">(총 구독료 − 총 혜택)</span></th><td class="num" style="font-weight:700">' + won(Math.max(0, T.finalP - T.preAmt)) + '</td></tr>';
        sumBox += '<tr><th>선납금 <span style="font-weight:500;color:#666">(계약 시 선결제 · 지불액 가산)</span></th><td class="num" style="color:#1A4FA0;font-weight:700">+' + won(T.preAmt) + '</td></tr>';
      }
      sumBox += '<tr class="tot"><th>최종 혜택가 <span style="font-weight:600;font-size:.9em">(총 지불액)</span></th><td class="num">' + won(T.finalP) + '</td></tr>';
      sumBox += '</table></div>';
    }
    var lump = num(q.opt.lumpSum);
    var hero;
    var heroTail = (T.reward > 0 ? '<br>💵 이벤트 리워드 1% ' + won(T.reward) + ' 차감 반영' : '')
      + (T.pointCommon > 0 ? '<br>⭐ 멤버십 포인트 ' + fmt(T.pointCommon) + 'P 차감 반영' + (pm === 'replace' ? '' : ' (별도 적립)') : '')
      + (T.preAmt > 0 ? '<br>선납금 합계 ' + won(T.preAmt) + ' 선결제 · 최종 혜택가에 포함' : '');
    if(lump > 0){
      var diff = lump - T.finalP;
      hero = '<div class="q-hero"><div class="lbl">최종 혜택가 vs 일시불가</div><div class="val">' + won(T.finalP) + '</div>'
        + '<div class="sub">일시불가 <b>' + won(lump) + '</b> 대비 ' + (diff >= 0 ? '<b>' + won(diff) + ' (' + (diff / lump * 100).toFixed(1) + '%) 저렴</b>' : '<b>' + won(-diff) + ' 부담</b>') + ' · 총 혜택 ' + won(T.benefit)
        + heroTail + '</div></div>';
    } else {
      hero = '<div class="q-hero"><div class="lbl">혜택 모두 반영 시 최종 혜택가</div><div class="val">' + won(T.finalP) + '</div>'
        + '<div class="sub">총 혜택 <b>' + won(T.benefit) + '</b> 반영'
        + heroTail + '</div></div>';
    }
    var h = '<div class="q-sum' + (sumBox ? '' : ' solo') + '">' + sumBox + '<div>' + hero;
    if(!payBand){   // 매달 내시는 금액 밴드가 없을 때만 (같은 숫자 중복 방지)
      h += '<div class="q-mini">'
        + '<div><div class="k">월 구독료 합계</div><div class="v">' + won(T.monthly) + '</div></div>'
        + '<div><div class="k">월 구독료 혜택가</div><div class="v" style="color:#1A4FA0">' + won(Math.max(0, Math.round(T.afterCardM))) + '</div></div>'
        + (mo > 0 ? '<div><div class="k">계약 기간' + (T.count > 1 ? ' (최장)' : '') + '</div><div class="v">' + mo + '개월</div></div>' : '')
        + (S.realM && mo > 0 ? '<div><div class="k">월 체감 구독료</div><div class="v">' + won(Math.round(T.finalP / mo)) + '</div></div>' : '')
        + '</div>';
    }
    if(lump > 0){
      var bMax = Math.max(T.finalP, lump, 1);
      h += '<div class="q-bars">'
        + '<div class="bar"><span class="l">최종 혜택가</span><div class="track"><div class="fill f" style="width:' + Math.max(4, Math.round(T.finalP / bMax * 100)) + '%"></div></div><span class="a" style="color:#1A4FA0">' + won(T.finalP) + '</span></div>'
        + '<div class="bar"><span class="l">일시불가</span><div class="track"><div class="fill" style="width:' + Math.max(4, Math.round(lump / bMax * 100)) + '%;background:#8A909E"></div></div><span class="a">' + won(lump) + '</span></div>'
        + '</div>';
    }
    h += '</div></div>';
    function srow(l, v){ if(v <= 0) return ''; return '<tr><th>' + l + '</th><td class="num">-' + won(v) + '</td></tr>'; }
    blocks.push(h);
    blocks.push('<div class="q-memo"><div class="t">세부 상담 내용</div>'
      + (EDIT ? '<textarea class="q-memo-in" data-q="cust.memo" placeholder="희망 설치일, 색상, 특이사항, 안내한 조건 등">' + esc(q.cust.memo) + '</textarea>'
              : (q.cust.memo ? esc(q.cust.memo) : '<span style="color:#bbb">-</span>')) + '</div>');
    blocks.push('<div class="q-note">' + ((q.cust.untilMode === 'none' || !q.cust.until)
      ? '※ 본 견적은 별도 유효기한이 설정되지 않은 안내 견적이며, 실제 지불 금액은 본사 지침·프로모션 변경 및 전월 카드 실적에 따라 다소 차이가 있을 수 있습니다. '
      : '※ 본 견적은 ' + esc(displayYmd(q.cust.until)) + '까지 유효하며, 실제 지불 금액은 본사 지침·프로모션 변경 및 전월 카드 실적에 따라 다소 차이가 있을 수 있습니다. ')
      + '제휴카드 혜택은 카드 청구 시점에 적용되는 청구할인이며, 삼성전자 멤버십 포인트는 계약 후 지급됩니다.'
      + (T.preAmt > 0 ? ' 선납금은 계약 시 별도 선결제되며 총 지불액에 포함됩니다.' : '')
      + ' 다품목 할인은 신규 고객이 2개 이상 동시 구독 시 적용되며, 본 견적서에서 <b>“다품목 해당”</b>으로 표기된 '
      + T.multiCount + '개 제품에 반영되었습니다.</div>');
    sheet.classList.toggle('editing', EDIT);
    /* 글자 크기 단계: 1개 → 큰 글씨(n1) → 기본 → 소폭 축소(xs). 2개 → 기본 → xs. 3개 이상 → 기본(여러 장 허용) */
    var tiers = one ? [' n1', '', ' xs'] : (visible.length <= 2 ? ['', ' xs'] : ['']);
    if(EDIT) tiers = [''];
    var tip = sheet.innerHTML, foot = namecardHtml(q);
    for(var t = 0; t < tiers.length; t++){
      sheet.innerHTML = tip;
      if(paginate(sheet, blocks, foot, q, tiers[t]) === 1) break;
    }
    fitScale();
    renderWarnings(q);
    autosaveDraft();
    if(pvEl){ pvEl.scrollTop = pvTop; pvEl.scrollLeft = pvLeft; }
    var badge = document.getElementById('qNoBadge');
    if(badge) badge.textContent = q.meta.no ? (q.meta.no + (q.meta.version > 1 ? ' v' + q.meta.version : '') + ' 발행됨') : '미발행';
  }

/* ═══ 고객 화면 ═══ */
function esc2(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function contactBox(d){
  d=d||{}; const tel=d.tel||d.store_tel||'031-8042-3166';
  const st=d.store_tel&&d.store_tel!==tel?d.store_tel:'';
  return `<div class="cbox cpro">
      ${d.counselor?`<div class="n">${esc2(d.counselor)} ${esc2(d.counselor_role||'프로')}</div>
        ${d.counselor_title?`<div class="d">${esc2(d.counselor_title)}</div>`:''}`
      :`<div class="n">${esc2(d.store_name||'삼성스토어 시흥점')}</div>`}
      <p class="note" style="margin-top:8px">${esc2(d.note||'기존 견적 금액 조회 및 추가 상담은 '+tel+' 으로 연락해 주세요.')}</p>
      <a class="cbtn" href="tel:${esc2(tel.replace(/[^0-9+]/g,''))}">📞 ${esc2(tel)} 전화하기</a>
      ${st?`<a class="cbtn ghost" href="tel:${esc2(st.replace(/[^0-9+]/g,''))}">매장 ${esc2(st)}</a>`:''}
      ${d.no?`<p class="note" style="margin-top:10px">문의하실 때 견적번호 <b>${esc2(d.no)}</b> 를 말씀해 주세요.</p>`:''}
    </div>`;
}
function fail(ico,title,body,d){
  $('sheetWrap').innerHTML='';
  $('top').innerHTML=`<div class="cbox cerr"><div class="i">${ico}</div><h2>${esc2(title)}</h2>
    <p class="note">${body}</p></div>`+contactBox(d);
  $('bottom').innerHTML=`<div class="cfoot">${esc2((d&&d.store_name)||'삼성스토어 시흥점')} · 삼성전자 공식 판매점</div>`;
}
(async function(){
  if(!tok) return fail('🔗','주소가 올바르지 않습니다','담당자가 보내 드린 링크를 그대로 눌러 주세요.');
  $('qSheet').innerHTML='<div class="cbox"><div class="cskel" style="width:40%"></div><div class="cskel"></div><div class="cskel" style="width:70%"></div></div>';
  let d;
  try{ const r=await sb.rpc('fn_quote_public',{p_token:tok}); if(r.error) throw new Error(r.error.message); d=r.data; }
  catch(e){ return fail('⚠️','지금 열 수 없습니다','잠시 뒤 다시 시도해 주세요.'); }
  if(!d||!d.ok){
    if(d&&d.reason==='expired') return fail('⏳','열람 기간이 지난 견적서입니다',
      `${esc2(d.expired_at||'')} 까지 보실 수 있었습니다.<br><b>견적 내용은 그대로 남아 있습니다.</b> 연락 주시면 바로 다시 보내 드립니다.`, d);
    if(d&&d.reason==='revoked') return fail('🔒','이 링크는 사용이 중지되었습니다','새 견적으로 다시 보내 드리겠습니다.', d);
    return fail('🔎','견적서를 찾을 수 없습니다','링크가 잘못되었거나 지워진 견적서입니다.', d);
  }
  draw(d);
})();
function draw(d){
  /* 발행할 때 쓴 네임카드를 그대로 — 견적서 푸터가 이걸 그린다 */
  const ncId=(d.quote&&d.quote.opt&&d.quote.opt.namecardId)||'';
  NAMECARDS = d.counselor ? [{ id:ncId, name:d.counselor, position:d.counselor_role||'프로',
      dept:d.counselor_title||'', store:QUOTE_CFG.store.name, mobile:d.tel||'',
      tel:d.store_tel||QUOTE_CFG.store.tel, email:d.counselor_email||'', addr:QUOTE_CFG.store.addr }] : [];
  QUOTE = d.quote;
  try{ renderSheet(); trimLastPage(); }
  catch(e){ $('qSheet').innerHTML='<div class="cbox"><p class="note">견적서를 그리지 못했습니다. 담당자에게 연락해 주세요.</p></div>'; }
  try{ fitScale(); }catch(e){}
  window.addEventListener('resize', ()=>{ try{ fitScale(); }catch(e){} });

  $('top').innerHTML = d.valid_over ? `<div class="cbox warn">
      <div class="t">⏳ 이 견적의 유효기간이 지났습니다</div>
      <p class="note" style="margin-top:6px"><b>${esc2(d.valid_until||'')}</b> 까지였습니다.
        아래 금액은 <b>그때 기준</b>이라 지금과 다를 수 있습니다.<br>${esc2(d.note||'')}</p>
      <a class="cbtn gold" href="tel:${esc2(String(d.tel||'').replace(/[^0-9+]/g,''))}">📞 ${esc2(d.tel||'')} 전화하기</a>
    </div>` : '';

  $('bottom').innerHTML =
      `<div class="crow noprint"><button class="cbtn" onclick="window.print()">🖨 인쇄 · PDF 저장</button>
        <button class="cbtn ghost" onclick="shareThis()">↗ 공유하기</button></div>`
    + contactBox(d)
    + `<div class="cfoot">${esc2(d.store_name||'삼성스토어 시흥점')} · 삼성전자 공식 판매점<br>
        이 견적은 ${esc2(d.expires_at)} 까지 보실 수 있습니다</div>`;
  document.title = `${d.name||''} 님 견적서 · ${d.no}`;
}
/* 화면에서는 마지막 장의 남는 아래 여백을 접는다 — 인쇄할 때는 A4 그대로 */
function trimLastPage(){ try{
    const pgs=document.querySelectorAll('.q-page');
    if(pgs.length) pgs[pgs.length-1].classList.add('q-last-auto');
  }catch(e){} }
async function shareThis(){
  const t=document.title, u=location.href;
  if(navigator.share){ try{ await navigator.share({title:t,text:t,url:u}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(u); alert('링크를 복사했습니다'); }catch(e){ prompt('아래 주소를 복사하세요', u); }
}
</script>
