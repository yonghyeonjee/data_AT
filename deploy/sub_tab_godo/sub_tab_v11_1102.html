<!-- ===== [구독탭] 상품상세 일시불/구독 탭 모듈 (goods/_sub_tab.html) =====
     goods_view.html 맨 아래에서 includeFile('goods/_sub_tab.html') 한 줄로 끼워 넣는다 (주석에도 중괄호 치환문은 쓰지 않는다).
     화면 파일(sub_tab_<판>.js · .css)은 고도몰 웹FTP /data/js/sub/ 에, 요금표·정책·카드표·공통 기준값은 데이터센터(dcBase)에서 5분마다 새 판을 읽는다.
     ▶ 비개발자 안내: 금액·기본 카드·상담 전화·문구는 이 파일이 아니라 데이터센터 관리자(admin.html › 품목 › 구독 혜택 정책)에서 바꾼다. 이 파일은 켜고 끄기(enabled)만 손댄다.
     화면 파일을 새로 올릴 때는 파일 이름에 판(sub_tab_<판>.js · .css)을 붙여 올리고 아래 link · script 의 파일 이름과 uiVer 를 같이 바꾼다 (고도몰 CDN 이 1시간 캐시하므로 같은 이름으로 덮어쓰지 않는다).
     ※ 고도몰 템플릿 치환 방지: 인라인 JS 의 여는 중괄호 뒤에는 항상 공백 · 주소는 전부 / 또는 https:// 로 시작하는 절대 경로만 (상대 경로는 스킨 경로가 붙는다) -->
<!-- [구독탭] 데이터 소스 (화면 비노출) : 추가항목 "구독모델" → 모델번호 → 자체상품코드 / 옵션별 자체옵션코드 -->
<div id="subTabSrc" hidden>
    <i data-k="model" data-v="{=goodsView['goodsModelNo']}"></i>
    <i data-k="model" data-v="{=goodsView['goodsCd']}"></i>
    <!--{ ? empty(goodsView['addInfo']) === false }-->
    <!--{ @ goodsView['addInfo'] }--><i data-k="add" data-t="{=.infoTitle}" data-v="{=.infoValue}"></i><!--{ / }-->
    <!--{ / }-->
    <!--{ ? goodsView['optionFl'] == 'y' }-->
    <!--{ @ goodsView['option'] }--><i data-k="opt" data-sno="{=.sno}" data-v="{=.optionCode}"></i><!--{ / }-->
    <!--{ / }-->
</div>
<link rel="stylesheet" href="/data/js/sub/sub_tab_261102a.css">
<script type="text/javascript">
    /* ※ 고도몰 템플릿 치환 방지: 여는 중괄호 뒤에는 항상 공백 */
    var SUB_TAB_CONFIG = { uiVer: '261102a',        /* 화면 파일(/data/js/sub/sub_tab_<판>.js · .css) 판 — 새로 올릴 때마다 바꾼다 (위 link · 아래 script 의 파일 이름과 같이) */
        dcBase: 'https://db.samsungat.co.kr/sdp/sub/',  /* 데이터센터 배포 주소 — 요금표·정책·카드표·공통 기준값. 비우면 아래 dataBase 만 쓴다 */
        dataBase: '/data/js/sub/',                 /* 데이터센터를 못 읽을 때 예비 사본 (같은 폴더에 sub_index.js 등을 올려 두면 동작) */
        ver: '',                                   /* 예비 사본 판 (비우면 캐시 무시 없음) */
        enabled: true,                             /* ★ 'test': 주소에 ?subtab=on 붙인 사람만 보임 → 검증 후 true 로 오픈, 문제 시 false (비개발자가 손대는 건 이 줄뿐) */
        onlyGoods: [],                             /* 시범 상품번호만: 예 ['1000000123','1000000456'] (비우면 전체) */
        skipCate: ['012'],                         /* 대표 카테고리가 이 코드로 시작하면(구독상품) 탭을 띄우지 않는다 */
        goodsNo: '{=goodsView['goodsNo']}',
        lumpPrice: '{=gd_isset(goodsView['goodsPrice'], 0)}',
        /* ── 아래 넷은 비워 둔다 → 데이터센터 정책(관리자 › 구독 혜택 정책 › 기본 기준·상담 연락처)의 값을 쓴다. 이 스킨만 다르게 할 때만 채운다 ── */
        consultUrl: '',                            /* 상담 신청 페이지 (정책값: /main/html.php?htmid=service/SamSungSubscription.html) */
        tel: '',                                   /* 'consult' 일 때 상담 버튼 옆 전화 버튼 (정책값: 매장 대표번호) */
        defaultCard: '',                           /* 처음 선택돼 있는 제휴카드 (정책값: 삼성카드) */
        defaultTier: '',                           /* 처음 선택할 실적 구간 (정책값: 30만↑) */
        cta: 'lump+consult',                       /* 하단 버튼: 'lump+consult' = [시흥몰 가격 확인하기]+[구독 문의하기] · 'consult' = [상담하고 구독하기]+전화 */
        cardGuideUrl: '',                          /* "혜택 받는 방법" 링크 (비우면 숨김) */
        addInfoTitle: '구독모델',
        feeInfoTitle: '구독요금',                   /* 이 추가항목 값이 파일 요금보다 우선 */
        productCat: '',                            /* 파일에 없는 모델일 때 품목 (상담서 관심제품·선납 한도에 사용, 예: '김치냉장고') */
        defaultTab: 'lump',                        /* 'sub' 로 바꾸면 구독 탭이 먼저 열림 (URL ?buy=sub 도 동일) */
        lumpOnly: ['.price-box', '.item_choice_list', '.item_price_cont', '.btn_choice_box', '.pay_box', '.npay-banner-wrap'],
        extraPoints: []                            /* 이 스킨에만 붙일 문구. 기간·품목별 행사 문구는 데이터센터 [구독 혜택 정책] 에서 관리 */
    };
</script>
<script type="text/javascript" src="/data/js/sub/sub_tab_261102a.js" charset="utf-8"></script>
<!-- //[구독탭] -->
