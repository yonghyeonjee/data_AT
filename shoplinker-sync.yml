name: 샵링커 정기 수집

on:
  schedule:
    - cron: "10 4 * * *"    # 13:10 KST
    - cron: "10 14 * * *"   # 23:10 KST
  workflow_dispatch:
    inputs:
      from:
        description: "시작일 YYYYMMDD (비우면 최근 3일 정기수집)"
        required: false
      to:
        description: "종료일 YYYYMMDD (비우면 오늘)"
        required: false
      dry:
        description: "적재하지 않고 건수만 보기"
        type: boolean
        default: false
      selftest:
        description: "연결 점검만 (수집하지 않음)"
        type: boolean
        default: false

concurrency:
  group: shoplinker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 수집
        env:
          SL_CUSTOMER_ID: ${{ secrets.SL_CUSTOMER_ID }}
          SL_REQ_URL: ${{ secrets.SL_REQ_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.selftest }}" = "true" ]; then
            node tools/shoplinker/collect.mjs --selftest
            exit $?
          fi
          ARGS=""
          [ -n "${{ inputs.from }}" ] && ARGS="$ARGS --from ${{ inputs.from }}"
          [ -n "${{ inputs.to }}"   ] && ARGS="$ARGS --to ${{ inputs.to }}"
          [ "${{ inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          node tools/shoplinker/collect.mjs $ARGS
