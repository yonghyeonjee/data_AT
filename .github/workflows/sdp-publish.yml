name: SDP 계산기 데이터 배포

# 데이터센터(sdp.release)에서 '반영'한 판을 db.samsungat.co.kr/sdp/*.js 로 만들어 올린다 (mvp_245).
# 고도몰 계산기(service/calc_subscribe.php)·견적서 페이지가 이 파일을 읽는다. 바뀐 게 없으면 커밋하지 않는다.
# 같은 판 + 구독 혜택 정책(sub.policy)으로 상품상세 구독탭 파일 sdp/sub/*.js 도 만든다 (mvp_246) — 정책을 고치면 다음 실행에 배포된다.
on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 확인 (GitHub 사정으로 몇 분 늦을 수 있음 — 2026-10-27 생성 뒤 13시간 동안 한 번도 안 돌았다)
  workflow_dispatch:
  push:                      # 배포 도구나 이 파일이 바뀌면 바로 한 번 돈다 (봇 커밋은 sdp/ 만 건드려 다시 돌지 않는다)
    branches: [main]
    paths: ['.github/workflows/sdp-publish.yml', 'tools/sdp/**', 'tools/sub/**']

concurrency:
  group: sdp-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 반영된 판 받기
        id: pub
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tools/sdp/publish.mjs
      - name: 커밋 · 푸시
        if: steps.pub.outputs.changed != '' && steps.pub.outputs.changed != '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          git config user.name  "sdp-publish[bot]"
          git config user.email "sdp-publish@users.noreply.github.com"
          git add sdp
          git commit -m "SDP 계산기 데이터 배포 ${{ steps.pub.outputs.ver }} · 구독탭 ${{ steps.pub.outputs.subver }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
          node tools/sdp/publish.mjs --deployed "${{ steps.pub.outputs.ver }}" "${{ steps.pub.outputs.subver }}" "$(git rev-parse --short HEAD)"
